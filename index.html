   ================================================================ */
function setField(o,k,v){ o[k] = (v===''||v==null) ? null : v; }
function toggleIn(arr,v){ const i=arr.indexOf(v); if(i>-1) arr.splice(i,1); else arr.push(v); }

document.addEventListener('click', e=>{
  const nav = e.target.closest('.nav button');
  if (nav){ go(nav.dataset.nav); return; }
  if (e.target.closest('#themeBtn')){
    DB.settings.theme = DB.settings.theme==='dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = DB.settings.theme; save(); return;
  }
  if (e.target.closest('#sheetClose') || e.target.id==='sheetBg'){ closeSheet(); render(); return; }

  const s = e.target.closest('[data-sact]');
  if (s){ sheetAction(s.dataset.sact, s.dataset.v, s); return; }

  const b = e.target.closest('[data-act]');
  if (!b) return;
  action(b.dataset.act, b.dataset.v, b, e);
});

/* Only <select> uses 'change'. Text and number fields are handled on 'input' and never
   trigger a re-render — a re-render on blur would detach the element the user is tapping
   next, and a click on a detached node never reaches this listener, so the first tap after
   typing would silently do nothing. */
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.id==='impFile'){ importFile(t.files[0]); return; }
  if (t.tagName !== 'SELECT') return;
  const s = t.closest('[data-sact]'); if (s){ sheetAction(s.dataset.sact, t.value, s, true); return; }
  const b = t.closest('[data-act]'); if (b) action(b.dataset.act, t.value, b, e);
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.act==='hole-note'){ const h=H(); if(h){ h.note=t.value; save(); } return; }
  if (t.id==='pNotes'){ pDraft.notes = t.value; return; }
  if (['nrCourse','nrTees','nrRating','nrSlope','nrIndex'].indexOf(t.id) > -1){ updateCH(); return; }
  if (['app-dist','app-prox'].indexOf(t.dataset.act)>-1){
    const h=H(); if(!h) return;
    setField(h.app, t.dataset.act==='app-dist'?'dist':'prox', t.value===''?null:+t.value); save(); return;
  }
  const s = t.closest('[data-sact]'); if (s) sheetAction(s.dataset.sact, t.value, s, true);
});

function action(a, v, node, ev){
  const r = R(), h = H();
  switch(a){
    case 'toggle': {
      DB.settings.collapsed[v] = !DB.settings.collapsed[v]; save();
      const c = document.getElementById('card-'+v); if (c) c.classList.toggle('collapsed'); return;
    }
    case 'nr-feel': $$('[data-act="nr-feel"]').forEach(x=>x.classList.toggle('on', x.dataset.v===v)); return;
    case 'start': {
      const course = $('#nrCourse').value.trim();
      if (!course){ toast('Course name, please'); $('#nrCourse').focus(); return; }
      const feelBtn = document.querySelector('[data-act="nr-feel"].on');
      const nr = newRound({
        date: $('#nrDate').value, course, tees: $('#nrTees').value.trim(),
        rating: numOrNull($('#nrRating')), slope: numOrNull($('#nrSlope')), index: numOrNull($('#nrIndex')),
        wind: null, conditions: null, temp: null,
        feel: feelBtn ? +feelBtn.dataset.v : null
      });
      DB.rounds.push(nr); cur = {roundId:nr.id, hole:0}; saveNow(); render(); return;
    }
    case 'open':  cur = {roundId:v, hole:0}; render(); return;
    case 'exit':  cur = {roundId:null, hole:0}; render(); return;
    case 'del-round': {
      if (ev) ev.stopPropagation();
      if (!confirm('Delete this round permanently?')) return;
      DB.rounds = DB.rounds.filter(x=>x.id!==v); if (cur.roundId===v) cur.roundId=null; saveNow(); render(); return;
    }
    case 'prev': cur.hole = (cur.hole+17)%18; render(); return;
    case 'next': cur.hole = (cur.hole+1)%18;  render(); return;
    case 'jump': cur.hole = +v; render(); return;
    case 'par':  h.par = +v; syncTee(h); save(); render(); return;
    case 'sc':     h.score = clamp((h.score==null ? h.par : h.score) + (+v), 1, 15); save(); render(); return;
    case 'sc-par': h.score = h.score===h.par ? null : h.par; save(); render(); return;
    case 'quickpar': {
      h.score = h.par;
      if (h.par!==3){
        syncTee(h);
        h.tee.outcome = 'good';
        h.tee.dir = 'F';  h.tee.offline = null;
        h.tee.dist = 'ok'; h.tee.distOff = null;
        if (!h.tee.strike.length) h.tee.strike = ['Middle'];
      }
      /* one shot at the green — and on a par 3 that one shot IS the tee shot */
      if (!h.app.some(a=>AT_GREEN(a.state)))
        h.app.push(newApp({state:'gir', lie: h.par===3 ? 'Tee' : 'Fairway'}));
      saveNow(); render();
      /* never invent putts — open the sheet and let the real ones be entered */
      if (!h.putts.length) puttSheet(null);
      return;
    }
    case 'pen':
      h.penalties = clamp((h.penalties||0) + (+v), 0, 9); save(); render(); return;
    case 'tee-out':    h.tee.outcome = h.tee.outcome===v ? null : v; save(); render(); return;
    case 'tee-dir': {
      h.tee.dir = h.tee.dir===v ? null : v;
      if (h.tee.dir === 'F' || h.tee.dir == null) h.tee.offline = null;   /* offline is meaningless in the fairway */
      save(); render(); return;
    }
    case 'tee-off':    h.tee.offline = h.tee.offline===v ? null : v; save(); render(); return;
    case 'tee-dist': {
      h.tee.dist = h.tee.dist===v ? null : v;
      if (h.tee.dist === 'ok' || h.tee.dist == null) h.tee.distOff = null;
      save(); render(); return;
    }
    case 'tee-distoff': h.tee.distOff = h.tee.distOff===v ? null : v; save(); render(); return;
    case 'tee-strike': toggleIn(h.tee.strike, v); save(); render(); return;
    case 'tee-club':   h.tee.club = v; save(); return;
    case 'add-app':    appSheet(null); return;
    case 'edit-app':   appSheet(+v); return;
    case 'del-app':    h.app.splice(+v,1); save(); render(); return;
    case 'chain-app':  appSheet(null, +v); return;
    case 'mental-tab': mentalTab = v; render(); return;
    case 'mental':     toggleIn(h.mental[mentalTab], v); save(); render(); return;
    case 'add-putt':   puttSheet(null); return;
    case 'edit-putt':  puttSheet(+v); return;
    case 'del-putt':   h.putts.splice(+v,1); save(); render(); return;
    case 'chain-putt':  puttSheet(null, +v); return;
    case 'chain-short': shortSheet(null, +v); return;
    case 'add-short':  shortSheet(null); return;
    case 'edit-short': shortSheet(+v); return;
    case 'del-short':  h.short.splice(+v,1); save(); render(); return;
    case 'finish':     finishRound(); return;
    case 'filter':     statFilter = v; renderStats(); return;
    case 'pArea':      toggleIn(pDraft.areas, v); renderPractice(); return;
    case 'pQual':      pDraft.qual = +v; renderPractice(); return;
    case 'psave': {
      const d = $('#pDate').value, m = $('#pMin').value;
      if (!pDraft.areas.length){ toast('Tag at least one area'); return; }
      DB.practice.push({id:uid(), date:d, min: m?+m:null, areas: pDraft.areas.slice(), qual: pDraft.qual, notes: $('#pNotes').value.trim()});
      pDraft = {areas:[], qual:3, notes:''}; saveNow(); renderPractice(); toast('Session saved'); return;
    }
    case 'pdel': DB.practice = DB.practice.filter(x=>x.id!==v); saveNow(); renderPractice(); return;
    case 'syncnow': syncScan(); syncPush(); if (!es || es.readyState === 2) syncStream(); toast('Syncing'); return;
    case 'csv-shots':  csvShots(); return;
    case 'csv-rounds': csvRounds(); return;
    case 'csv-putts':  csvPutts(); return;
    case 'json':       dl('shot-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(DB,null,2), 'application/json'); return;
    case 'wipe':
      if (!confirm('Delete every round and practice session? Export first if you want a copy.')) return;
      if (!confirm('Last chance — this cannot be undone.')) return;
      DB = {rounds:[], practice:[], tomb:DB.tomb, schema:DB.schema, settings:DB.settings};
      cur={roundId:null,hole:0}; saveNow(); render(); toast('All data deleted'); return;
  }
}

function sheetAction(a, v, node, silent){
  const h = H();
  switch(a){
    case 'dist':   tmp.dist = +v; drawPuttSheet(); return;
    case 'distin': tmp.dist = v===''?null:+v; syncSaveBtn(tmp.dist!=null && tmp.holed!=null); return;
    case 'sBrk':   tmp.brk = tmp.brk===v?null:v; drawPuttSheet(); return;
    case 'sSlope': tmp.slope = tmp.slope===v?null:v; drawPuttSheet(); return;
    case 'sHoled': tmp.holed = v==='yes'; if (tmp.holed){ tmp.rem=null; tmp.miss=[]; } drawPuttSheet(); return;
    case 'rem':    tmp.rem = v===''?null:+v; return;
    case 'sMiss':  toggleIn(tmp.miss, v); drawPuttSheet(); return;
    case 'save': {
      if (tmp.dist==null || tmp.holed==null) return;
      const p = {dist:tmp.dist, brk:tmp.brk, slope:tmp.slope, holed:tmp.holed, rem:tmp.rem, miss:tmp.miss.slice()};
      const isNew = tmp._i==null;
      if (isNew) h.putts.push(p); else h.putts[tmp._i]=p;
      saveNow(); closeSheet(); render();
      /* a missed putt's remaining distance IS the next putt — walk straight into it */
      if (isNew && !p.holed && p.rem!=null && p.rem > 0) puttSheet(null, p.rem);
      return;
    }
    case 'sgdist':  tmp.dist = v===''?null:+v; syncSaveBtn(tmp.dist!=null); return;
    case 'sgClub':  tmp.club = v; if (v==='Putter') tmp.type='putt'; else if (tmp.type==='putt') tmp.type=null; drawShortSheet(); return;
    case 'sgType':  tmp.type = tmp.type===v?null:v; drawShortSheet(); return;
    case 'sgLie':   tmp.lie = tmp.lie===v?null:v; drawShortSheet(); return;
    case 'sgStrike':toggleIn(tmp.strike, v); drawShortSheet(); return;
    case 'sgMiss':  toggleIn(tmp.miss, v); drawShortSheet(); return;
    case 'sgOn':    tmp.onGreen = v==='yes'; if (tmp.onGreen) tmp.remYds=null; else tmp.prox=null; drawShortSheet(); return;
    case 'sgprox':  tmp.prox = v===''?null:+v; return;
    case 'sgrem':   tmp.remYds = v===''?null:+v; return;
    case 'sgsave': {
      if (tmp.dist==null || tmp.onGreen==null) return;
      const ty = tmp.type || sgTypeFor(tmp);
      const putt = ty==='putt' || tmp.club==='Putter';
      const sg = {dist:tmp.dist, club:tmp.club, type:ty, lie:tmp.lie,
                  strike: putt ? [] : tmp.strike.slice(),
                  miss:   putt ? tmp.miss.slice() : [],
                  onGreen:tmp.onGreen, prox:tmp.prox, remYds:tmp.remYds,
                  /* a putt played from off the putting surface — it counts as a short-game
                     shot for up-and-down AND as a putt for lag and make rate */
                  fromOffGreen: putt};
      const isNew = tmp._i==null;
      if (isNew) h.short.push(sg); else h.short[tmp._i]=sg;
      saveNow(); closeSheet(); render();
      /* keep walking the hole: on the green means putts, still short means another chip */
      if (isNew){
        if (sg.onGreen && sg.prox!=null && !h.putts.length) puttSheet(null, sg.prox);
        else if (!sg.onGreen && sg.remYds!=null && sg.remYds>0) shortSheet(null, sg.remYds);
      }
      return;
    }
    case 'aState':  {
      tmp.state = tmp.state===v ? null : v;
      if (tmp.state==='gir') tmp.zone = null;
      if (AT_GREEN(tmp.state)) tmp.result = tmp.remYds = null; else tmp.zone = tmp.prox = null;
      if (H().par===3 && (tmp._i===0 || (tmp._i==null && !H().app.length))) tmp.lie = 'Tee';
      drawAppSheet(); return;
    }
    case 'adist':   tmp.dist = v===''?null:+v; return;
    case 'aClub':   tmp.club = v; return;
    case 'aLie':    tmp.lie = tmp.lie===v?null:v; drawAppSheet(); return;
    case 'aStrike': toggleIn(tmp.strike, v); drawAppSheet(); return;
    case 'aZone':   tmp.zone = tmp.zone===v?null:v; drawAppSheet(); return;
    case 'aprox':   tmp.prox = v===''?null:+v; return;
    case 'aOut':    tmp.result = tmp.result===v?null:v; drawAppSheet(); return;
    case 'arem':    tmp.remYds = v===''?null:+v; return;
    case 'asave': {
      if (tmp.state==null) return;
      if (!AT_GREEN(tmp.state) && tmp.result==null) return;
      const a = newApp({state:tmp.state, kind:tmp.kind, dist:tmp.dist, club:tmp.club, lie:tmp.lie,
                        strike:tmp.strike.slice(), result:tmp.result, remYds:tmp.remYds,
                        zone:tmp.zone, prox:tmp.prox});
      const isNew = tmp._i==null;
      if (isNew) h.app.push(a); else h.app[tmp._i]=a;
      saveNow(); closeSheet(); render();
      /* keep walking the hole. Still stuck means another swing is coming; anything else
         hands off by button so a sheet never jumps under a thumb mid-entry. */
      if (isNew && a.state==='recovery' && a.result==='trouble' && a.remYds!=null && a.remYds>0)
        appSheet(null, a.remYds);
      return;
    }
    case 'rnote':  { const r=R(); if(r){ r.notes = v; save(); } return; }
    case 'close':  closeSheet(); render(); return;
    case 'closeout': closeSheet(); cur={roundId:null,hole:0}; saveNow(); render(); return;
  }
}
function syncSaveBtn(ok){
  const b = document.querySelector('#sheetBody [data-sact="save"], #sheetBody [data-sact="sgsave"], #sheetBody [data-sact="asave"]');
  if (b) b.disabled = !ok;
}

function importFile(f){
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const p = JSON.parse(rd.result);
      if (!p || !Array.isArray(p.rounds)) throw new Error('bad file');
      if (!confirm('Replace all current data with this backup? '+p.rounds.length+' rounds found.')) return;
      DB.rounds = p.rounds; DB.practice = Array.isArray(p.practice)?p.practice:[];
      DB.settings = Object.assign(DB.settings, p.settings||{});
      DB.schema = p.schema; migrate();
      cur = {roundId:null, hole:0}; saveNow(); render(); toast('Restored '+p.rounds.length+' rounds');
    } catch(err){ toast('That file could not be read'); }
  };
  rd.readAsText(f);
}

/* ---------- keyboard (desktop convenience) ---------- */
document.addEventListener('keydown', e=>{
  if (e.target.matches('input,textarea,select')) return;
  if (VIEW!=='round' || !R()) return;
  if (e.key==='ArrowLeft')  action('prev');
  if (e.key==='ArrowRight') action('next');
});


/* ---------- cloud sync ----------
   Firebase Realtime Database over plain REST + server-sent events. No SDK, so the app
   stays a single file with no dependencies and still opens offline.

   The path below IS the credential: 144 random bits, and the database rules grant
   read/write to that path and to nothing else. Anyone with the URL has the rounds;
   nobody without it can reach anything, including the database root.

   Records are stored as JSON *strings* rather than as trees, because Realtime Database
   silently drops nulls and empty arrays — `strike: []` and `score: null` would come back
   as undefined and the hole would be subtly wrong. A string round-trips exactly. */
const SYNC_URL  = 'https://shot-tracker-ac928-default-rtdb.firebaseio.com';
const SYNC_PATH = 'st-zXi4mbn4815C-8BJpocfHRjW';
const SYNC_BASE = SYNC_URL + '/' + SYNC_PATH;

let syncState  = 'connecting';        /* connecting | live | offline | error */
let syncSeen   = 0;                   /* last successful exchange */
let syncPend   = false;               /* a render was deferred because a sheet was open */
let remoteTree = {rounds:{}, practice:{}};
const snap  = {rounds:Object.create(null), practice:Object.create(null)};
const dirty = new Map();
let scanT, pushT, retryT, es;

const KINDS = ['rounds','practice'];
const listOf = k => k === 'rounds' ? DB.rounds : DB.practice;

function syncSetState(s){
  syncState = s;
  const el = document.getElementById('syncLine');
  if (el) el.innerHTML = syncLine();
}
function syncLine(){
  const n = dirty.size;
  const ago = syncSeen ? Math.round((Date.now()-syncSeen)/1000) : null;
  const when = ago==null ? 'not yet' : ago < 60 ? 'just now'
             : ago < 3600 ? Math.round(ago/60)+' min ago' : Math.round(ago/3600)+' h ago';
  const head = syncState==='live' ? 'Live — this device and your phone are in step.'
             : syncState==='connecting' ? 'Connecting…'
             : 'Offline. Rounds are saved here and go up when you reconnect.';
  return head + '<br>Last exchange: ' + when + (n ? ' · ' + n + ' waiting to upload' : '');
}

/* Detect local edits by diffing each record against the last value we reconciled. Doing
   it this way leaves every existing mutation path untouched — nothing has to remember to
   mark itself dirty, including deletes, which show up as an id that has gone missing. */
function syncScan(){
  KINDS.forEach(kind => {
    const seen = Object.create(null), sn = snap[kind];
    listOf(kind).forEach(rec => {
      if (!rec || !rec.id) return;
      seen[rec.id] = 1;
      const known = sn[rec.id] !== undefined;
      if (!rec.updated) rec.updated = rec.created || Date.parse(rec.date) || 0;
      const j = JSON.stringify(rec);
      if (sn[rec.id] === j) return;
      if (known) { rec.updated = Date.now(); }           /* a real edit, this session */
      sn[rec.id] = JSON.stringify(rec);
      syncQueue(kind, rec.id, {updated: rec.updated, json: sn[rec.id], schema: SCHEMA});
    });
    Object.keys(sn).forEach(id => {
      if (seen[id]) return;
      delete sn[id];
      const t = Date.now();
      DB.tomb[kind][id] = t;
      syncQueue(kind, id, {updated: t, deleted: true});
    });
  });
}
function syncTouch(){ clearTimeout(scanT); scanT = setTimeout(syncScan, 400); }

function syncQueue(kind, id, rec){
  const rem = remoteTree[kind] && remoteTree[kind][id];
  if (rem && (rem.updated||0) >= (rec.updated||0) && !!rem.deleted === !!rec.deleted
      && rem.json === rec.json && (rem.schema||0) === (rec.schema||0)) return;   /* already up there */
  dirty.set(kind + '/' + id, rec);
  clearTimeout(pushT); pushT = setTimeout(syncPush, 700);
  syncSetState(syncState);
}

async function syncPush(){
  clearTimeout(retryT);
  if (!dirty.size) return;
  for (const [k, rec] of Array.from(dirty.entries())){
    try {
      const res = await fetch(SYNC_BASE + '/' + k + '.json',
        {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec)});
      if (!res.ok) throw new Error(res.status);
      dirty.delete(k);
      syncPut(remoteTree, k.split('/'), rec);
      syncSeen = Date.now();
    } catch(e){
      syncSetState('offline');
      retryT = setTimeout(syncPush, 15000);
      return;
    }
  }
  syncSetState(es && es.readyState === 1 ? 'live' : syncState);
}

/* Apply a remote snapshot. Newest edit wins, per record — which is what stops the
   export/import shuffle from ever losing a round again. */
function syncMerge(tree){
  let changed = false;
  KINDS.forEach(kind => {
    const m = (tree && tree[kind]) || {}, list = listOf(kind);
    Object.keys(m).forEach(id => {
      const rec = m[id]; if (!rec) return;
      /* A device on an older build must not try to read a record written by a newer one —
         it would silently drop the fields it does not know about on the next save. */
      if ((rec.schema || 0) > SCHEMA) return;
      const ru = rec.updated || 0;
      const i  = list.findIndex(x => x && x.id === id);
      const lu = i > -1 ? (list[i].updated || 0) : (DB.tomb[kind][id] || 0);
      if (ru <= lu) return;
      if (rec.deleted){
        if (i > -1){ list.splice(i,1); changed = true; }
        DB.tomb[kind][id] = ru;
        delete snap[kind][id];
        if (kind === 'rounds' && cur.roundId === id) cur = {roundId:null, hole:0};
      } else if (rec.json){
        let v; try { v = JSON.parse(rec.json); } catch(e){ return; }
        if (!v || typeof v !== 'object') return;
        v.id = id; v.updated = ru;
        if (i > -1) list[i] = v; else list.push(v);
        snap[kind][id] = JSON.stringify(v);
        changed = true;
      }
    });
  });
  if (changed){
    DB.schema = 0; migrate();          /* incoming rounds may predate a schema bump */
    saveNow();
    syncRender();
  }
  return changed;
}

/* Never redraw under someone's thumb: if a sheet is open or a field has focus, wait. */
function syncRender(){
  const sheet = document.getElementById('sheet');
  const busy  = (sheet && sheet.classList.contains('on'))
             || (document.activeElement && document.activeElement.matches('input,textarea,select'));
  if (busy){ syncPend = true; return; }
  syncPend = false;
  render();
}
function syncFlushRender(){ if (syncPend) setTimeout(syncRender, 60); }

function syncPut(o, p, val){
  if (!p.length) return;
  let t = o;
  for (let i=0;i<p.length-1;i++){
    if (typeof t[p[i]] !== 'object' || t[p[i]] === null) t[p[i]] = {};
    t = t[p[i]];
  }
  const last = p[p.length-1];
  if (val === null) delete t[last]; else t[last] = val;
}
function syncNorm(t){
  const o = (t && typeof t === 'object') ? t : {};
  if (!o.rounds   || typeof o.rounds   !== 'object') o.rounds   = {};
  if (!o.practice || typeof o.practice !== 'object') o.practice = {};
  return o;
}

function syncEvent(type, raw){
  let m; try { m = JSON.parse(raw); } catch(e){ return; }
  if (!m || typeof m.path !== 'string') return;
  syncSeen = Date.now();
  const p = m.path === '/' ? [] : m.path.split('/').filter(Boolean);
  if (type === 'put'){
    if (!p.length) remoteTree = syncNorm(m.data);
    else syncPut(remoteTree, p, m.data);
  } else {
    Object.keys(m.data || {}).forEach(k =>
      syncPut(remoteTree, p.concat(k.split('/').filter(Boolean)), m.data[k]));
  }
  remoteTree = syncNorm(remoteTree);
  syncMerge(remoteTree);
  syncSetState('live');
}

function syncStream(){
  if (!('EventSource' in window)) return;
  try { es = new EventSource(SYNC_BASE + '.json'); } catch(e){ return; }
  es.addEventListener('put',        e => syncEvent('put', e.data));
  es.addEventListener('patch',      e => syncEvent('patch', e.data));
  es.addEventListener('keep-alive', () => { syncSeen = Date.now(); syncSetState('live'); });
  es.onopen  = () => { syncSetState('live'); syncPush(); };
  es.onerror = () => syncSetState('offline');   /* EventSource reconnects on its own */
}

async function syncStart(){
  if (!DB.tomb) DB.tomb = {rounds:{}, practice:{}};
  if (!DB.tomb.rounds)   DB.tomb.rounds   = {};
  if (!DB.tomb.practice) DB.tomb.practice = {};
  syncSetState('connecting');
  try {
    const res = await fetch(SYNC_BASE + '.json', {cache:'no-store'});
    if (!res.ok) throw new Error(res.status);
    remoteTree = syncNorm(await res.json());
    syncSeen = Date.now();
    syncMerge(remoteTree);
  } catch(e){ syncSetState('offline'); }
  syncScan();                 /* first pass seeds the snapshots and uploads anything new */
  syncPush();
  syncStream();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden){ syncTouch(); syncPush(); }
  });
  window.addEventListener('online', () => { syncPush(); if (!es || es.readyState === 2) syncStream(); });
}

/* ---------- boot ---------- */
load();
migrate();
document.documentElement.dataset.theme = DB.settings.theme==='dark' ? 'dark' : 'light';
const unfinished = DB.rounds.filter(r=>!r.finished).sort((a,b)=>b.created-a.created)[0];
if (unfinished) cur.roundId = unfinished.id;
render();
syncStart();

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

</script>
