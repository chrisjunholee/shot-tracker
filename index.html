<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<link rel="manifest" href="manifest.json">
<title>Shot Tracker</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --brand:#14532d; --brand-2:#1baf7a; --brand-wash:#e8f3ec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --bad-ink:#bf2f24;
  --sc-birdie:#1f66bd; --sc-par:#157f3a; --sc-bogey:#b8501c; --sc-double:#bf2f24;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  /* ink for a label sitting ON a filled mark. It has to clear 4.5:1 against the fill,
     not against the page, so it is not --ink. Measured against all four diverging fills:
     white tops out at 4.42:1 and fails everywhere; #0b0b0b misses on light blue at 4.46:1;
     pure black clears all four (4.76 / 5.31 / 5.77 / 6.50). Same value in both themes. */
  --on-mark:#000000;
  --r:12px; --pad:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --brand:#1baf7a; --brand-2:#199e70; --brand-wash:#16261f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c; --bad-ink:#e66767;
  --sc-birdie:#2a78d6; --sc-par:#18913f; --sc-bogey:#cc5a1f; --sc-double:#cf3629;
  --seq1:#184f95; --seq2:#256abf; --seq3:#2a78d6; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
  --on-mark:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(72px + var(--safe-b));
  overscroll-behavior-y:contain;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--s1)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
.topbar h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;opacity:.8;font-weight:400}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.14);color:#fff;flex:none}

/* ---------- layout ---------- */
.wrap{max-width:640px;margin:0 auto;padding:12px}
.view{display:none}
.view.on{display:block}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card > .hd{
  display:flex;align-items:center;gap:8px;padding:11px var(--pad);
  border-bottom:1px solid var(--border);background:var(--surface-2);
}
.card > .hd h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);flex:1}
.card > .bd{padding:var(--pad)}
.card.collapsed > .bd{display:none}
.chev{font-size:12px;color:var(--muted);transition:transform .15s}
.card.collapsed .chev{transform:rotate(-90deg)}
.hd .tick{font-size:12px;color:var(--good-ink);font-weight:650}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row + .row{margin-top:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;width:100%;margin-bottom:-2px}
.sublbl{font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0}
.hidden{display:none !important}

/* ---------- chips / segmented ---------- */
.chip{
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  padding:9px 13px;font-size:14px;font-weight:550;color:var(--ink-2);
  min-height:40px;display:inline-flex;align-items:center;gap:6px;
}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on.warnstate{background:var(--crit);border-color:var(--crit)}
.chip.sm{padding:6px 10px;font-size:13px;min-height:34px}
.chip.wide{flex:1;justify-content:center}

.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;width:100%}
.seg.c2{grid-template-columns:1fr 1fr}
.seg.c3{grid-template-columns:1fr 1fr 1fr}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg button{
  border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:10px 6px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:48px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;
}
.seg button small{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button.on small{color:rgba(255,255,255,.8)}
.seg button.on.ok{background:var(--good);border-color:var(--good)}
.seg button.on.bad{background:var(--crit);border-color:var(--crit)}
.seg button.on.mid{background:var(--serious);border-color:var(--serious);color:#0b0b0b}
.seg button.on.mid small{color:rgba(11,11,11,.65)}

/* ---------- inputs ---------- */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
input[type=number],input[type=text],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 11px;min-height:44px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-wash)}
textarea{min-height:64px;resize:vertical;line-height:1.4}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.btn{
  background:var(--brand);color:#fff;border-radius:11px;padding:12px 16px;
  font-weight:650;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:var(--crit)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}

/* course-handicap readout on the start form */
.chbox{margin-top:12px;padding:11px 13px;border:1px solid var(--brand-2);border-radius:var(--r);background:var(--brand-wash)}
.chbox.muted{border-color:var(--border);background:var(--surface-2);color:var(--muted);font-size:13px;line-height:1.4}
.chbox .chv{font-size:15px;font-weight:650;color:var(--ink)}
.chbox .chv b{font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chbox .chm{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45;font-variant-numeric:tabular-nums}
.chbox .chw{font-size:12.5px;color:var(--crit);margin-top:6px;line-height:1.4}
:root[data-theme="dark"] .chbox .chv{color:var(--ink)}

/* ---------- hole nav ---------- */
.holenav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.holenav .nb{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:22px;flex:none}
.holenav .mid{flex:1;text-align:center}
.holenav .h{font-size:22px;font-weight:750;letter-spacing:-.02em}
.holenav .p{font-size:12px;color:var(--muted)}
/* scorecard strip: fixed hole-number row, colour-coded score row beneath */
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin-bottom:12px}
.strip .col{padding:0;border:1px solid var(--border);border-radius:5px;overflow:hidden;display:block}
.strip .hn,.strip .sc{display:flex;align-items:center;justify-content:center;line-height:1;font-variant-numeric:tabular-nums}
.strip .hn{height:17px;font-size:9px;font-weight:700;color:var(--muted);background:var(--surface-2)}
.strip .hn.t{color:var(--brand);background:var(--brand-wash)}
:root[data-theme="dark"] .strip .hn.t{color:var(--brand-2)}
.strip .sc{height:23px;font-size:12px;font-weight:750;background:var(--surface);color:var(--ink)}
.strip .sc.birdie{background:var(--sc-birdie);color:#fff}
.strip .sc.par{background:var(--sc-par);color:#fff}
.strip .sc.bogey{background:var(--sc-bogey);color:#fff}
.strip .sc.double{background:var(--sc-double);color:#fff}
.strip .col.cur{outline:2px solid var(--brand);outline-offset:1px}
:root[data-theme="dark"] .strip .col.cur{outline-color:var(--brand-2)}

/* bottom hole navigation */
.footnav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0 8px}
.footnav .btn{padding:9px 4px;font-size:12.5px;min-height:58px;line-height:1.2;text-align:center;font-weight:600}

.scorebar{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.scorebar .step{width:54px;height:54px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:26px;display:grid;place-items:center;flex:none}
.scorebar .val{font-size:40px;font-weight:750;min-width:78px;height:56px;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:none;border:none}
.scorebar .rel{font-size:12px;font-weight:650;padding:5px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);line-height:1}
.rel.birdie{background:var(--sc-birdie);color:#fff}
.rel.par{background:var(--sc-par);color:#fff}
.rel.bogey{background:var(--sc-bogey);color:#fff}
.rel.double{background:var(--sc-double);color:#fff}

/* ---------- 3x3 miss grid ---------- */
.missgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:280px;margin:0 auto}
.missgrid button{
  aspect-ratio:1.35;border:1px solid var(--border);background:var(--surface);border-radius:10px;
  font-size:11px;font-weight:600;color:var(--ink-2);display:grid;place-items:center;text-align:center;line-height:1.1;
}
.missgrid button.centre{background:var(--brand-wash);color:var(--brand);border-color:var(--brand-2);font-size:18px}
:root[data-theme="dark"] .missgrid button.centre{color:var(--brand-2)}
.missgrid button.on{background:var(--crit);border-color:var(--crit);color:#fff}
.missgrid button.centre.on{background:var(--good);border-color:var(--good);color:#fff}

/* ---------- shot list rows ---------- */
.shotrow{
  display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);margin-bottom:7px;
}
.shotrow .n{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.shotrow .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.shotrow .txt b{font-weight:650}
.shotrow .txt em{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.shotrow .del{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:16px;flex:none;background:var(--surface-2)}
.holed{color:var(--good-ink);font-weight:700}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--surface);
  border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;display:none;
  padding:0 0 calc(16px + var(--safe-b));box-shadow:0 -8px 32px rgba(0,0,0,.2);
}
.sheet.on{display:block}
.sheet .shd{position:sticky;top:0;background:var(--surface);padding:14px var(--pad) 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;z-index:2}
.sheet .shd h3{font-size:16px;flex:1}
.sheet .sbd{padding:var(--pad)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--axis);margin:8px auto 0}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.tile .v{font-size:27px;font-weight:750;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.tile .v small{font-size:14px;font-weight:600;color:var(--ink-2)}
.tile .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.tile .d.pos{color:var(--good-ink)}
.tile .d.neg{color:var(--crit)}

.chartbox{margin-bottom:16px}
.note + .chartbox{margin-top:18px}
.chartbox h4{font-size:14px;margin-bottom:2px}
.chartbox .cap{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg{display:block;width:100%;overflow:visible}
svg text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
svg text.val{fill:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums}
svg text.val.on{fill:var(--on-mark)}
/* the hole must add up: shots + penalties = score. Never colour alone — the glyph
   and the words carry it, the colour only makes it findable. */
.recon{margin-top:12px;padding:9px 11px;border-radius:9px;background:var(--surface-2);
  font-size:12.5px;font-weight:600;text-align:center;color:var(--ink-2);
  font-variant-numeric:tabular-nums;line-height:1.45}
.recon.ok{color:var(--good-ink)}
.recon.bad{color:var(--bad-ink)}
.penrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.penrow .lb{font-size:12.5px;color:var(--ink-2);font-weight:600}
.penrow .pv{min-width:26px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums}
.badge-inc{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:var(--surface-2);color:var(--bad-ink);letter-spacing:.02em;margin-left:6px}
svg text.lab{fill:var(--ink-2)}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg rect.mk{rx:4}

.leak{display:flex;gap:11px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:8px;align-items:flex-start}
.leak .rank{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:750;color:#fff;flex:none;background:var(--muted)}
.leak.p1 .rank{background:var(--crit)}
.leak.p2 .rank{background:var(--serious)}
.leak.p3 .rank{background:var(--warn);color:#0b0b0b}
.leak .t{font-size:14.5px;font-weight:650}
.leak .s{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.leak .fix{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650}
table.tbl th:first-child,table.tbl td:first-child{text-align:left;font-variant-numeric:normal}
details.tblwrap{margin-top:8px}
details.tblwrap summary{font-size:12.5px;color:var(--s1);cursor:pointer;padding:4px 0}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.empty p{margin:6px 0 0;font-size:14px;line-height:1.5}

.roundrow{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:8px}
.roundrow .sc{width:46px;height:46px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;font-weight:750;flex:none;font-variant-numeric:tabular-nums}
.roundrow .m{flex:1;min-width:0}
.roundrow .m b{font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roundrow .m span{font-size:12px;color:var(--muted)}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:var(--safe-b);
}
.nav button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--brand)}
:root[data-theme="dark"] .nav button.on{color:var(--brand-2)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:120;
  background:var(--ink);color:var(--plane);padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:8px}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
</style>
</head>
<body>
<div class="topbar">
  <div class="grow">
    <h1 id="barTitle">Shot Tracker</h1>
    <div class="sub" id="barSub">Trust the Process</div>
  </div>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
</div>

<!-- ============ ROUND ============ -->
<div class="view on" id="view-round"><div class="wrap" id="roundWrap"></div></div>

<!-- ============ STATS ============ -->
<div class="view" id="view-stats"><div class="wrap" id="statsWrap"></div></div>

<!-- ============ PRACTICE ============ -->
<div class="view" id="view-practice"><div class="wrap" id="practiceWrap"></div></div>

<!-- ============ DATA ============ -->
<div class="view" id="view-data"><div class="wrap" id="dataWrap"></div></div>

<div class="nav">
  <button data-nav="round" class="on"><span class="ic">⛳</span>Round</button>
  <button data-nav="stats"><span class="ic">◧</span>Stats</button>
  <button data-nav="practice"><span class="ic">◎</span>Practice</button>
  <button data-nav="data"><span class="ic">⚙</span>Data</button>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shd"><h3 id="sheetTitle"></h3><button class="icon-btn" id="sheetClose" style="background:var(--surface-2);color:var(--ink)">✕</button></div>
  <div class="sbd" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   Shot Tracker — Adam Young method, extended
   Single-file offline app. All data in localStorage.
   ================================================================ */
'use strict';

const KEY = 'shotTrackerV1';

/* ---------- reference data ---------- */
const CLUBS = ['Driver','Mini driver','3 wood','4 wood','5 wood','7 wood',
  '3 hybrid','4 hybrid','5 hybrid',
  '3 iron','4 iron','5 iron','6 iron','7 iron','8 iron','9 iron',
  'Pitching wedge','Gap wedge','Sand wedge','Lob wedge'];

const TEE_OUT = [
  {k:'good',    label:'Good',    sub:'In play, clear shot', cls:'ok'},
  {k:'blocked', label:'Blocked', sub:'In play, no shot',    cls:'mid'},
  {k:'trouble', label:'Trouble', sub:'Recovery only',       cls:'bad'},
  {k:'penalty', label:'Penalty', sub:'OB / lost / hazard',  cls:'bad'}
];

function expPutts(d){
  if (d==null || d<=0) return 1;
  if (d <= EXP_PUTTS[0][0]) return EXP_PUTTS[0][1];
  for (let i=1;i<EXP_PUTTS.length;i++){
    const [x1,y1] = EXP_PUTTS[i-1], [x2,y2] = EXP_PUTTS[i];
    if (d <= x2) return y1 + (d-x1)*(y2-y1)/(x2-x1);
  }
  return EXP_PUTTS[EXP_PUTTS.length-1][1];
}

/* ---------- model ---------- */
const newTee = () => ({club:'Driver', outcome:null, dir:null, offline:null,
                      dist:null, distOff:null, strike:[]});
const newApp = o => Object.assign({state:null, kind:null, dist:null, club:'', lie:null,
                      strike:[], result:null, remYds:null, zone:null, prox:null}, o||{});

function newHole(i, par){
  const p = par || DEFAULT_PARS[i] || 4;
  return {
    n:i+1, par:p, score:null, penalties:0,
    /* On a par 3 the tee shot IS the shot at the green, so it is logged once, in app[].
       There is no tee block at all — an empty one was quietly putting a phantom driver
       on every par 3. */
    tee: p===3 ? null : newTee(),
    app:[], short:[], putts:[], mental:{tee:[], app:[], putt:[], general:[]}, note:''
  };
}
/* par is editable mid-round, so the tee block has to appear and disappear with it */
function syncTee(h){
  if (h.par===3) h.tee = null;
  else if (!h.tee) h.tee = newTee();
}

/* ---------- schema migration ----------
   Runs once at load. Never drops anything: tags logged before the phase split are
   parked under `general` and still counted, because we cannot know which phase they
   belonged to. */
const SCHEMA = 5;

/* Two verified corrections from the 23 Aug reconciliation pass. Matched on the wrong
   value as well as the round, so a hand-fix is never clobbered and re-running is safe. */
const DATA_FIXES = [
  {date:'2026-08-08', course:'Steele Canyon', field:'rating', from:71.9, to:71.4},
  {date:'2026-08-22', course:'Maderas',       field:'slope',  from:136,  to:138}
];

function migrate(){
  if (DB.schema === SCHEMA) return;
  let touched = 0;
  DB.rounds.forEach(r => {
   let gaps = 0;
   (r.holes||[]).forEach(h => {
    /* v3 → v4: layup / advance / recovery shots. Older rounds get an empty list rather
       than an invented one — those shots were played but never recorded, so they stay
       out of every extra-shot ratio instead of being guessed at. */
    if (!Array.isArray(h.extra) && !Array.isArray(h.app)) h.extra = [];

    /* v4 → v5: the single approach object and the separate extra[] array become one
       ordered app[]. Nothing is back-filled — the shots that were never captured cannot
       be inferred, which is exactly why the round gets flagged incomplete below. */
    if (!Array.isArray(h.app)){
      const a  = h.app || {};
      const xs = (h.extra||[]).map(x => newApp({
        state: x.kind==='recovery' ? 'recovery' : 'layup',
        kind:  x.kind || null,            /* 'advance' has no state of its own; keep the word */
        dist:  x.dist ?? null, club: x.club || '', lie: x.lie || null,
        strike: Array.isArray(x.strike) ? x.strike : [],
        result: x.result || null, remYds: x.remYds ?? null
      }));
      const at = AT_GREEN(a.state) ? [newApp({
        state: a.state, dist: a.dist ?? null, club: a.club || '', lie: a.lie || null,
        strike: Array.isArray(a.strike) ? a.strike : [],
        zone: a.zone || null, prox: a.prox ?? null
      })] : [];
      /* on a par 3 the shot at the green came first — it was the tee shot */
      h.app = h.par===3 ? at.concat(xs) : xs.concat(at);
      delete h.extra;
    }
    if (typeof h.penalties !== 'number') h.penalties = 0;
    syncTee(h);
    (h.short||[]).forEach(sg => {
      /* club was never captured, so it stays empty. type is only ever DERIVED from
         fields that were recorded (lie, yards) — a shot from the fringe is not assumed
         to have been a putt, because nothing in the file says which club was used. */
      if (sg.club === undefined) sg.club = '';
      if (sg.type === undefined) sg.type = sgTypeFor(sg);
      if (sg.fromOffGreen === undefined) sg.fromOffGreen = false;
      if (!Array.isArray(sg.miss)) sg.miss = [];
    });
    if (h.score != null && holeShots(h) + (h.penalties||0) !== h.score) gaps++;
    if (h.tee){
      if (h.tee.dir === 'straight') h.tee.dir = 'F';       /* old "straight" meant not offline */
      if (h.tee.dist === undefined)    h.tee.dist = null;
      if (h.tee.distOff === undefined) h.tee.distOff = null;
      if (!Array.isArray(h.tee.strike)) h.tee.strike = [];
    }
    (h.short||[]).forEach(sg => {
      if (sg.onGreen === undefined) sg.onGreen = null;   /* unknown for shots logged before the split */
      if (sg.remYds  === undefined) sg.remYds  = null;
    });
    if (Array.isArray(h.mental)){
      h.mental = {tee:[], app:[], putt:[], general: h.mental.slice()};
      touched++;
    } else if (!h.mental || typeof h.mental !== 'object'){
      h.mental = {tee:[], app:[], putt:[], general:[]};
    } else {
      MENTAL_KEYS.forEach(k => { if (!Array.isArray(h.mental[k])) h.mental[k] = []; });
    }
   });
   /* A round whose holes do not reconcile has shots that were never written down.
      It is kept and still counted for everything it can answer, but any statistic that
      needs the full shot chain leaves it out rather than computing a wrong number. */
   if (r.incomplete === undefined) r.incomplete = gaps > 0;
   r.gapHoles = gaps;
  });
  DB.rounds.forEach(r => DATA_FIXES.forEach(f => {
    if (r.date===f.date && r.course===f.course && r[f.field]===f.from) r[f.field] = f.to;
  }));
  DB.schema = SCHEMA;
  saveNow();
  if (touched) console.info('migrated ' + touched + ' holes of mental tags to phase buckets');
}

const mentalAll   = h => MENTAL_KEYS.reduce((a,k) => a.concat((h.mental && h.mental[k]) || []), []);
const mentalCount = h => mentalAll(h).length;
function newRound(m){

/* birdie-or-better / par / bogey / double-or-worse */
function scoreClass(rel){
  return rel==null ? '' : rel<=-1 ? 'birdie' : rel===0 ? 'par' : rel===1 ? 'bogey' : 'double';
}
function scoreLabel(rel){
  if (rel==null) return '';
  if (rel<=-3) return 'Albatross';
  return {'-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double','3':'Triple'}[String(rel)] || plus(rel);
}

/* ---------- derived from the shot chain — none of this is stored ---------- */

/* Every stroke that was a swing at the ball. Penalties are counted separately because
   they are strokes without a shot. */
function holeShots(h){
  return ((h.tee && h.tee.outcome) ? 1 : 0)
       + (Array.isArray(h.app) ? h.app.length : 0)
       + (h.short ? h.short.length : 0)
       + (h.putts ? h.putts.length : 0);
}

/* Strokes taken to get the ball onto the putting surface, penalties included.
   null means the file never records it getting there. */
function strokesToGreen(h){
  let n = (h.tee && h.tee.outcome) ? 1 : 0;
  const pen = h.penalties || 0;
  for (const a of (h.app||[])){ n++; if (a.state==='gir') return n + pen; }
  for (const sg of (h.short||[])){ n++; if (sg.onGreen === true) return n + pen; }
  return null;
}

/* Green in regulation is a fact about the chain, not a flag someone ticked: on the
   surface in par − 2. Rounds logged before the chain existed cannot be recomputed —
   their shots are missing — so those fall back to what was actually flagged at the time
   rather than pretending the derivation is possible. */
function girOf(h, incomplete){
  if (incomplete){
    const at = (h.app||[]).filter(a => AT_GREEN(a.state));
    return at.length ? at[at.length-1].state === 'gir' : null;
  }
  const st = strokesToGreen(h);
  return st == null ? null : st <= h.par - 2;
}

const NUMWORD = ['no','one','two','three','four','five','six'];
/* shots + penalties must equal the score. When it doesn't, something was not written
   down, and saying so at the hole is the only time it can still be fixed from memory. */
function recon(h){
  const shots = holeShots(h), pen = h.penalties||0, tot = shots + pen;
  if (h.score == null) return {shots, pen, tot, state:'none'};
  const diff = tot - h.score;
  return {shots, pen, tot, diff, state: diff===0 ? 'ok' : 'bad',
    msg: diff===0 ? '' : (diff<0
      ? (NUMWORD[Math.min(-diff,6)] || (-diff)) + ' shot' + (diff===-1?'':'s') + ' missing'
      : (NUMWORD[Math.min(diff,6)]  || diff)    + ' shot' + (diff===1?'':'s') + ' too many')};
}

function reconLine(h){
  const c = recon(h);
  if (c.state === 'none')
    return '<div class="recon">shots ' + c.shots + ' + penalties ' + c.pen + ' = ' + c.tot
         + ' \u2014 no score yet</div>';
  const body = 'shots ' + c.shots + ' + penalties ' + c.pen
    + (c.state==='ok' ? ' = score ' : ' \u2260 score ') + h.score;
  return '<div class="recon ' + c.state + '">' + body
    + (c.state==='ok' ? ' \u2713' : ' \u26a0 ' + c.msg) + '</div>';
}

/* the same check across the whole round — how many holes fail to add up */
function roundRecon(r){
  let holes=0, gaps=0, shots=0, pen=0, strokes=0;
  (r.holes||[]).forEach(h=>{
    if (h.score==null) return;
    holes++; shots += holeShots(h); pen += (h.penalties||0); strokes += h.score;
    if (holeShots(h) + (h.penalties||0) !== h.score) gaps++;
  });
  return {holes, gaps, shots, pen, strokes};
}
function roundReconLine(r){
  const c = roundRecon(r);
  if (!c.holes) return '';
  const ok = c.gaps === 0;
  return '<div class="recon ' + (ok?'ok':'bad') + '">'
    + 'shots ' + c.shots + ' + penalties ' + c.pen + (ok ? ' = ' : ' \u2260 ') + 'score ' + c.strokes
    + (ok ? ' \u2713 every hole adds up'
          : ' \u26a0 ' + c.gaps + ' of ' + c.holes + ' hole' + (c.gaps===1?'':'s') + ' do not add up')
    + '</div>';
}

function holeTouched(h){
  return h.score!=null || (h.tee && (h.tee.outcome || h.tee.dir)) || (h.app && h.app.length)
      || h.putts.length || h.short.length || (h.penalties||0) > 0 || mentalCount(h) > 0;
}
function roundTotal(r){
  const s = r.holes.filter(h=>h.score!=null);
  return s.length ? { strokes: s.reduce((a,h)=>a+h.score,0), par: s.reduce((a,h)=>a+h.par,0), n: s.length } : null;
}
/* ---------- World Handicap System ----------
   Course Handicap = Index x (Slope / 113) + (Course Rating - Par), rounded.
   Score Differential = (113 / Slope) x (Gross - Course Rating). PCC is ignored. */
function totalPar(r){ return r.holes.reduce((a,h)=>a+h.par,0); }

function courseHandicap(index, slope, rating, par){
  if (index==null || slope==null || !slope) return null;
  const adj = (rating!=null && par!=null) ? (rating - par) : 0;
  return Math.round(index * (slope/113) + adj);
}
function scoreDifferential(gross, rating, slope){
  if (gross==null || rating==null || slope==null || !slope) return null;
  return (113/slope) * (gross - rating);
}
/* soft sanity bounds — out-of-range values still compute, they just get flagged */
const SANE = { rating:[55,90], slope:[55,155], index:[-10,54] };
function outOfRange(k, v){ return v!=null && (v < SANE[k][0] || v > SANE[k][1]); }

function totalPutts(r){ return r.holes.reduce((a,h)=>a+h.putts.length,0); }

  const cols = n<=2 ? 'c2' : (n===3 || n===5 || n===6) ? 'c3' : 'c4';
  return '<div class="seg '+cols+'">' + opts.map(o=>{
    /* NB: options may be plain strings — never read .sub/.cls off one, String.prototype
       has legacy .sub()/.link() methods that would render as "function sub()". */
    const obj = o !== null && typeof o === 'object';
    const k = obj && o.k!==undefined ? o.k : o;
    const label = obj && o.label!==undefined ? o.label : o;
    const sub = obj && o.sub ? o.sub : null;
    const cls = obj && o.cls ? o.cls : '';
    const on = Array.isArray(selected) ? selected.indexOf(k)>-1 : selected===k;
    return '<button '+a+'="'+act+'" data-v="'+esc(k)+'" class="'+(on?'on ':'')+cls+'">'
      + label + (sub ? '<small>'+sub+'</small>' : '') + '</button>';
  }).join('') + '</div>';
}
function chipRow(act, opts, selected, attr){
  const a = 'data-' + (attr || 'act');
  return '<div class="row">' + opts.map(o=>{
    const obj = o !== null && typeof o === 'object';
    const k = obj && o.k!==undefined ? o.k : o;
    const label = obj && o.label!==undefined ? o.label : o;
    const on = Array.isArray(selected) ? selected.indexOf(k)>-1 : selected===k;
    return '<button class="chip'+(on?' on':'')+'" '+a+'="'+act+'" data-v="'+esc(k)+'">'+esc(label)+'</button>';
  }).join('') + '</div>';
}
function selectEl(act, opts, val, blank, attr){
  /* a club logged before the list changed stays selectable rather than silently resetting */
  const list = (val && opts.indexOf(val)===-1) ? [val].concat(opts) : opts;
  return '<select data-'+(attr||'act')+'="'+act+'">' + (blank?'<option value="">'+esc(blank)+'</option>':'')
    + list.map(o=>'<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('') + '</select>';
}
function card(id, title, badge, body){
  const col = DB.settings.collapsed[id] ? ' collapsed' : '';
  return '<div class="card'+col+'" id="card-'+id+'">'
    + '<div class="hd" data-act="toggle" data-v="'+id+'"><h3>'+title+'</h3>'
    + (badge?'<span class="tick">'+badge+'</span>':'') + '<span class="chev">▼</span></div>'
    + '<div class="bd">'+body+'</div></div>';
}

/* ================================================================
   ROUND VIEW
   ================================================================ */
function renderRound(){
  const r = R();
  $('#roundWrap').innerHTML = r ? holeScreen(r) : startScreen();
  /* the readout is patched in place on input, so it needs seeding after a fresh render */
  if (!r) updateCH();
}

/* most recent index entered, so it carries between rounds */
function lastIndex(){
  const r = DB.rounds.slice().sort((a,b)=>b.created-a.created).find(x=>x.index!=null);
  return r ? r.index : null;
}
/* rating and slope remembered per course + tee */
function lastTeeBox(course, tees){
  const c = (course||'').trim().toLowerCase(), t = (tees||'').trim().toLowerCase();
  if (!c) return null;
  return DB.rounds.slice().sort((a,b)=>b.created-a.created).find(r =>
    (r.course||'').trim().toLowerCase() === c &&
    (!t || (r.tees||'').trim().toLowerCase() === t) &&
    (r.rating!=null || r.slope!=null)) || null;
}
/* the par this round will actually start with */
function parForCourse(course){
  const prior = DB.rounds.find(r => (r.course||'').toLowerCase() === (course||'').toLowerCase() && r.holes);
  return (prior ? prior.holes.map(h=>h.par) : DEFAULT_PARS).reduce((a,b)=>a+b,0);
}

const numOrNull = el => (!el || el.value==='') ? null : (isNaN(+el.value) ? null : +el.value);

/* Updates only #chOut — never re-renders the form, so it cannot swallow the next tap. */
function updateCH(){
  const out = $('#chOut'); if (!out) return;
  const courseEl = $('#nrCourse'), teesEl = $('#nrTees');
  const rEl = $('#nrRating'), sEl = $('#nrSlope'), iEl = $('#nrIndex');

  /* prefill rating and slope from the last round off these tees, never overwriting typing */
  const box = lastTeeBox(courseEl && courseEl.value, teesEl && teesEl.value);
  if (box){
    if (rEl && rEl.value==='' && box.rating!=null) rEl.value = box.rating;
    if (sEl && sEl.value==='' && box.slope!=null)  sEl.value = box.slope;
  }

  const rating = numOrNull(rEl), slope = numOrNull(sEl), index = numOrNull(iEl);
  const par = parForCourse(courseEl ? courseEl.value : '');
  const warn = [];
  if (outOfRange('rating', rating)) warn.push('course rating is normally 60–80');
  if (outOfRange('slope',  slope))  warn.push('slope runs 55–155');
  if (outOfRange('index',  index))  warn.push('that index looks off');

  if (index==null || slope==null){
    out.className = 'chbox muted';
    out.innerHTML = 'Enter your index and the slope and this works out your course handicap.';
    return;
  }
  const ch = courseHandicap(index, slope, rating, par);
  out.className = 'chbox';
  out.innerHTML = '<div class="chv">Course handicap <b>'+plus(ch)+'</b></div>'
    + '<div class="chm">' + r1(index) + ' × (' + slope + ' ÷ 113)'
    + (rating!=null ? ' + (' + r1(rating) + ' − ' + par + ')' : '')
    + ' — shoot <b>' + (par + ch) + '</b> to play to your handicap.'
    + (rating==null ? ' Add the course rating for the full formula.' : '')
    + '</div>'
    + (warn.length ? '<div class="chw">Worth a check — ' + warn.join('; ') + '.</div>' : '');
}

    + '<div class="chbox" id="chOut"></div>'
    + '<div class="row"><span class="lbl">How you felt going in (1 rough → 5 sharp)</span>'
    + segRow('nr-feel',[1,2,3,4,5],3)+'</div>'
    + '<div class="row" style="margin-top:14px"><button class="btn full" data-act="start">Start round</button></div>'
    + '<div class="note">Pars default to a standard 72 layout and copy from your last round at the same course. Change any hole’s par with one tap.</div>');

  if (recent.length){
    h += card('recent','Rounds','', recent.slice(0,25).map(rr=>{
      const t = roundTotal(rr);
      const rel = t ? t.strokes - t.par : null;

    h += '<div class="empty"><div class="big">⛳</div><h3>No rounds yet</h3>'

  return h;
