function holeScreen(r){
  const h = r.holes[cur.hole];
  const isP3 = h.par === 3;
  const t = roundTotal(r);

  /* nav */
  let out = '<div class="holenav">'
    + '<button class="nb" data-act="prev">‹</button>'
    + '<div class="mid"><div class="h">Hole '+h.n+'</div><div class="p">Par '+h.par
    + (t ? ' · Round ' + t.strokes + ' (' + (t.strokes-t.par===0?'E':plus(t.strokes-t.par)) + ')' : '') + '</div></div>'
    + '<button class="nb" data-act="next">›</button></div>';

  out += '<div class="strip">' + r.holes.map((x,i)=>{
    const rl = x.score!=null ? x.score - x.par : null;
    return '<button class="col'+(i===cur.hole?' cur':'')+'" data-act="jump" data-v="'+i+'" '
      + 'aria-label="Hole '+x.n+(x.score!=null?', '+x.score+' — '+scoreLabel(rl):'')+'">'
      + '<span class="hn'+(holeTouched(x)?' t':'')+'">'+x.n+'</span>'
      + '<span class="sc '+scoreClass(rl)+'">'+(x.score!=null?x.score:'')+'</span></button>';
  }).join('') + '</div>';

  /* score */
  const rel = h.score!=null ? h.score - h.par : null;
  out += '<div class="card"><div class="bd">'
    + '<div class="scorebar"><button class="step" data-act="sc" data-v="-1">−</button>'
    + '<button class="val" data-act="sc-par" style="color:'+(h.score==null?'var(--muted)':'var(--ink)')+'">'
    + (h.score!=null?h.score:h.par)+'</button>'
    + '<button class="step" data-act="sc" data-v="1">+</button></div>'
    + (h.score==null ? '<div class="sublbl" style="text-align:center;margin-top:-2px">tap the number for par, or step up and down</div>' : '')
    + '<div class="row" style="justify-content:center;gap:8px">'
    + (rel!=null ? '<span class="rel '+scoreClass(rel)+'">'+scoreLabel(rel)+'</span>' : '')
    + '<span class="rel">'+h.putts.length+' putt'+(h.putts.length===1?'':'s')+'</span>'
    + '</div>'
    + '<div class="row" style="margin-top:12px"><span class="lbl">Par</span>'+segRow('par',[3,4,5],h.par)+'</div>'
    /* A penalty is a stroke without a shot. It was only ever recorded as a tee-shot
       outcome, which described the swing but never reached the scorecard arithmetic. */
    + '<div class="penrow"><span class="lb">Penalty strokes</span>'
    + '<button class="step" data-act="pen" data-v="-1">−</button>'
    + '<span class="pv">'+(h.penalties||0)+'</span>'
    + '<button class="step" data-act="pen" data-v="1">+</button></div>'
    + reconLine(h)
    + '<div class="row" style="margin-top:12px"><button class="btn ghost full" data-act="quickpar">Quick par — good tee shot, green in reg, 2 putts</button></div>'
    + '</div></div>';

  /* tee shot (par 4/5 only) */
  if (!isP3){
    const T = h.tee;
    const dirLabel = (TEE_DIR.find(d=>d.k===T.dir)||{}).label;
    const badge = [dirLabel, T.outcome].filter(Boolean).join(' · ');
    let b = '<div class="row"><span class="lbl">Result</span>'+segRow('tee-out',TEE_OUT,T.outcome)+'</div>'
      + '<hr class="sep">'
      + '<div class="row"><span class="lbl">Where it finished</span>'+segRow('tee-dir',TEE_DIR,T.dir)+'</div>'
      + ((T.dir==='L'||T.dir==='R')
          ? '<div class="row"><span class="lbl">How far '+(T.dir==='L'?'left':'right')+'</span>'
            + segRow('tee-off',OFFLINE,T.offline)+'</div>' : '')
      + '<div class="row"><span class="lbl">Distance</span>'+segRow('tee-dist',TEE_DIST,T.dist)+'</div>'
      + ((T.dist==='short'||T.dist==='long')
          ? '<div class="row"><span class="lbl">How far '+(T.dist==='short'?'short':'past it')+'</span>'
            + segRow('tee-distoff',OFFLINE,T.distOff)+'</div>' : '')
      + '<hr class="sep">'
      + '<div class="row"><span class="lbl">Strike (tap all that applied)</span>'+segRow('tee-strike',TEE_STRIKE,T.strike)+'</div>'
      + '<div class="row" style="margin-top:12px"><div class="fld grow"><label>Club off the tee</label>'
      + selectEl('tee-club',CLUBS,T.club)+'</div></div>';
    out += card('tee','Tee shot',badge,b);
  }

  /* Every full swing after the tee shot, in the order it was played: layups, punch-outs
     and the shot at the green all in one list. They used to live in two places, and a
     layup had nowhere to go at all on a par 4, which is how holes stopped adding up. */
  const shotLine = (a,i) => {
    const st = APP_STATES.find(x=>x.k===a.state) || {};
    const kind = a.kind==='advance' ? 'Advance' : (st.label || 'Shot');
    const res = AT_GREEN(a.state)
      ? (a.state==='gir'
          ? '<span class="holed">on the green</span>' + (a.prox!=null ? ', ' + a.prox + ' ft' : '')
          : 'missed' + (a.zone ? ' ' + zoneWord(a.zone) : '') + (a.prox!=null ? ', ' + a.prox + ' yds out' : ''))
      : ((EXTRA_OUT.find(o=>o.k===a.result)||{}).label || 'result not logged')
        + (a.remYds!=null ? ', ' + a.remYds + ' yds left' : '');
    return '<div class="shotrow"><div class="n">'+(i+1)+'</div><div class="txt">'
      + '<b>'+esc(kind)+(a.dist!=null?' · '+a.dist+'y out':'')+(a.club?' · '+esc(a.club):'')+'</b>'
      + '<em>'+res+(a.strike && a.strike.length ? ' · '+esc(a.strike.join(', ')) : '')+'</em></div>'
      + '<button class="del" data-act="edit-app" data-v="'+i+'">✎</button>'
      + '<button class="del" data-act="del-app" data-v="'+i+'">🗑</button></div>';
  };
  let ab = h.app.map(shotLine).join('');
  ab += '<button class="btn ghost full" data-act="add-app">+ Add '
      + (h.app.length ? 'another shot' : (isP3 ? 'the tee shot' : 'a shot')) + '</button>';

  const lastA = h.app[h.app.length-1];
  /* the yards left IS the next shot's distance — hand it over rather than retype it */
  if (lastA && !AT_GREEN(lastA.state) && lastA.remYds!=null)
    ab += '<div class="row" style="margin-top:14px"><button class="btn full" data-act="chain-app" data-v="'+lastA.remYds+'">'
        + 'Next shot from ' + lastA.remYds + ' yds →</button></div>';
  if (lastA && lastA.state==='gir' && lastA.prox!=null && !h.putts.length)
    ab += '<div class="row" style="margin-top:14px"><button class="btn full" data-act="chain-putt" data-v="'+lastA.prox+'">'
        + 'Log putt 1 from ' + lastA.prox + ' ft →</button></div>';
  if (lastA && lastA.state==='miss' && lastA.prox!=null && !h.short.length)
    ab += '<div class="row" style="margin-top:14px"><button class="btn full" data-act="chain-short" data-v="'+lastA.prox+'">'
        + 'Log the short-game shot from ' + lastA.prox + ' yds →</button></div>';

  const green = h.app.filter(a=>AT_GREEN(a.state)).slice(-1)[0];
  const appBadge = green ? (green.state==='gir' ? '\u2713 green' : 'missed') : (h.app.length ? h.app.length+'' : '');
  out += card('app', isP3 ? 'Tee shot &amp; approach' : 'Approach, layups &amp; recovery', appBadge, ab);

  /* short game */
  let sb = h.short.length ? h.short.map((s,i)=>{
    const res = s.onGreen === true
        ? '<span class="holed">on the green</span>' + (s.prox!=null ? ', ' + s.prox + ' ft' : '')
      : s.onGreen === false
        ? 'missed again' + (s.remYds!=null ? ', ' + s.remYds + ' yds left' : '')
      : (s.prox!=null ? 'to ' + s.prox + ' ft' : 'result not logged');
    const ty = (SG_TYPES.find(t=>t.k===s.type)||{}).label;
    return '<div class="shotrow"><div class="n">'+(i+1)+'</div><div class="txt">'
      + '<b>'+(s.dist!=null?s.dist+'y':'—')+' from '+esc(s.lie||'—')
      + (ty?' · '+esc(ty):'')+(s.club?' · '+esc(s.club):'')+'</b>'
      + '<em>'+res+(s.strike && s.strike.length ? ' · '+esc(s.strike.join(', ')) : '')
      + (s.miss && s.miss.length ? ' · '+esc(s.miss.join(', ').toLowerCase()) : '')+'</em></div>'
      + '<button class="del" data-act="edit-short" data-v="'+i+'">✎</button>'
      + '<button class="del" data-act="del-short" data-v="'+i+'">🗑</button></div>';
  }).join('') : '';
  sb += '<button class="btn ghost full" data-act="add-short">+ Add short-game shot</button>';
  out += card('short','Short game <span style="text-transform:none;letter-spacing:0">(inside 50y)</span>', h.short.length?h.short.length+'':'', sb);

  /* putting */
  let pb = '';
  if (h.putts.length){
    pb += h.putts.map((p,i)=>{
      const brk = (BREAKS.find(b=>b.k===p.brk)||{}).label || '';
      const slp = (SLOPES.find(s=>s.k===p.slope)||{}).label || '';
      return '<div class="shotrow"><div class="n">'+(i+1)+'</div><div class="txt">'
        + '<b>'+p.dist+' ft '+(p.holed?'<span class="holed">— holed</span>':'— to '+(p.rem!=null?p.rem+' ft':'?'))+'</b>'
        + '<em>'+[brk,slp].filter(Boolean).join(' · ')
        + (p.miss && p.miss.length ? ' · missed '+p.miss.join(', ').toLowerCase() : '')+'</em></div>'
        + '<button class="del" data-act="edit-putt" data-v="'+i+'">✎</button>'
        + '<button class="del" data-act="del-putt" data-v="'+i+'">🗑</button></div>';
    }).join('');
    const first = h.putts[0];
    if (first && h.putts.length){
      const sg = expPutts(first.dist) - h.putts.length;
      pb += '<div class="note">First putt '+first.dist+' ft → '+h.putts.length+' putt'+(h.putts.length===1?'':'s')
        + '. Strokes gained putting <b style="color:'+(sg>=0?'var(--good-ink)':'var(--crit)')+'">'+plus(r2(sg))+'</b> '
        + '(tour baseline from '+first.dist+' ft is '+r2(expPutts(first.dist))+').</div>';
    }
  }
  pb += '<button class="btn ghost full" data-act="add-putt" style="margin-top:'+(h.putts.length?'8px':'0')+'">+ Add putt</button>';
  out += card('putt','Putting', h.putts.length?h.putts.length+'':'', pb);

  /* mental — tagged per phase */
  const M = h.mental;
  let mb = '<div class="row">'
    + segRow('mental-tab', MENTAL_PHASES.map(p=>({
        k:p.k, label:p.label, sub:(M[p.k].length ? M[p.k].length+' tagged' : '')
      })), mentalTab)
    + '</div>'
    + chipRow('mental', MENTAL, M[mentalTab])
    + (M.general && M.general.length
        ? '<div class="note">Tagged before the phases were split, kept for the stats: '
          + esc(M.general.join(', ')) + '</div>' : '')
    + '<div class="row" style="margin-top:12px"><div class="fld grow"><label>Strategy / note for this hole</label>'
    + '<textarea data-act="hole-note" placeholder="What was the decision, and would you make it again?">'+esc(h.note)+'</textarea></div></div>';
  out += card('mental','Mental &amp; strategy', mentalCount(h)?mentalCount(h)+'':'', mb);

  /* footer */
  out += '<div class="footnav">'
    + '<button class="btn ghost" data-act="exit">Round list</button>'
    + '<button class="btn ghost" data-act="prev">‹ Previous hole</button>'
    + '<button class="btn" data-act="next">Next hole ›</button>'
    + '<button class="btn ghost" data-act="finish">'+(r.finished?'Round summary':'Finish round')+'</button></div>';

  return out;
}

/* ---------- putt sheet ---------- */
let tmp = null;
function puttSheet(idx, preset){
  const h = H();
  tmp = idx==null
    ? {dist: (preset==null ? null : preset), brk:null, slope:null, holed:null, rem:null, miss:[]}
    : JSON.parse(JSON.stringify(h.putts[idx]));
  tmp._i = idx;
  tmp._n = (idx==null ? h.putts.length : idx) + 1;
  tmp._chained = idx==null && preset!=null;
  drawPuttSheet();
}
function drawPuttSheet(){
  const p = tmp;
  let b = (p._chained ? '<div class="note" style="margin:0 0 10px">Carried over from the putt you just left short — change it if the read was different.</div>' : '')
    + '<div class="row"><span class="lbl">Putt length (feet)</span>'
    + '<div class="row" style="gap:6px">' + PUTT_QUICK.map(d=>
        '<button class="chip sm'+(p.dist===d?' on':'')+'" data-sact="dist" data-v="'+d+'">'+d+'</button>').join('')
    + '</div></div>'
    + '<div class="row"><div class="fld" style="width:130px"><label>Or type it</label>'
    + '<input type="number" inputmode="numeric" data-sact="distin" value="'+(p.dist??'')+'" placeholder="ft"></div></div>'
    + '<hr class="sep">'
    + '<div class="row"><span class="lbl">Break</span>'+segRow('sBrk',BREAKS,p.brk,'sact')+'</div>'
    + '<div class="row"><span class="lbl">Slope</span>'+segRow('sSlope',SLOPES,p.slope,'sact')+'</div>'
    + '<hr class="sep">'
    + '<div class="row"><span class="lbl">Result</span>'
    + segRow('sHoled',[{k:'yes',label:'Holed',cls:'ok'},{k:'no',label:'Missed',cls:'bad'}], p.holed===true?'yes':p.holed===false?'no':null,'sact')+'</div>';
  if (p.holed===false){
    b += '<div class="row"><div class="fld" style="width:150px"><label>Left yourself (feet)</label>'
      + '<input type="number" inputmode="numeric" data-sact="rem" value="'+(p.rem??'')+'" placeholder="ft"></div></div>'
      + '<div class="row"><span class="lbl">Why it missed</span>'+segRow('sMiss',PUTT_MISS,p.miss,'sact')+'</div>';
  }
  b += '<div class="row" style="margin-top:16px">'
    + '<button class="btn full" data-sact="save"'+(p.dist==null||p.holed==null?' disabled':'')+'>Save putt</button></div>';
  openSheet((tmp._i==null ? 'Putt ' : 'Edit putt ') + tmp._n, b);
}

/* ---------- short game sheet ---------- */
function shortSheet(idx, preset){
  const h = H();
  tmp = idx==null
    ? {dist:(preset==null?null:preset), club:'', type:null, lie:null, strike:[], miss:[],
       onGreen:null, prox:null, remYds:null, fromOffGreen:false}
    : JSON.parse(JSON.stringify(h.short[idx]));
  tmp._i = idx;
  tmp._n = (idx==null ? h.short.length : idx) + 1;
  tmp._chained = idx==null && preset!=null;
  drawShortSheet();
}
function drawShortSheet(){
  const s = tmp;
  /* type follows the club, lie and distance until it is set by hand — once it is, it stays */
  const ty = s.type || sgTypeFor(s);
  const isPutt = ty === 'putt' || s.club === 'Putter';
  let b = (s._chained ? '<div class="note" style="margin:0 0 10px">Distance carried over from the shot before — change it if you paced it differently.</div>' : '')
    + '<div class="row"><div class="fld" style="width:118px"><label>Yards to pin</label>'
    + '<input type="number" inputmode="numeric" data-sact="sgdist" value="'+(s.dist??'')+'" placeholder="25"></div>'
    + '<div class="fld grow"><label>Club</label>'+selectEl('sgClub',SG_CLUBS,s.club,'—','sact')+'</div></div>'
    + '<div class="row"><span class="lbl">Shot</span>'+segRow('sgType',SG_TYPES,ty,'sact')+'</div>'
    + '<div class="row"><span class="lbl">Lie</span>'+segRow('sgLie',SG_LIES,s.lie,'sact')+'</div>'
    /* A putt from the fringe is a putt. Asking whether it was flush, fat or thin is a
       question about a wedge, and the answers it produced ("Bladed") meant nothing. */
    + (isPutt
        ? '<div class="row"><span class="lbl">If it missed, why</span>'+segRow('sgMiss',PUTT_MISS,s.miss,'sact')+'</div>'
          + '<div class="note" style="margin:2px 0 0">Logged as a putt — it joins your lag and make-rate numbers as well as up-and-down.</div>'
        : '<div class="row"><span class="lbl">Strike</span>'+segRow('sgStrike',SG_STRIKE,s.strike,'sact')+'</div>')
    + '<hr class="sep">'
    + '<div class="row"><span class="lbl">Where it finished</span>'
    + segRow('sgOn',[{k:'yes',label:'On the green',cls:'ok'},{k:'no',label:'Missed again',cls:'bad'}],
        s.onGreen===true?'yes':s.onGreen===false?'no':null,'sact')+'</div>';
  if (s.onGreen === true)
    b += '<div class="row"><div class="fld" style="width:150px"><label>'
      + (isPutt ? 'Feet left (0 if holed)' : 'Feet from pin') + '</label>'
      + '<input type="number" inputmode="numeric" data-sact="sgprox" value="'+(s.prox??'')+'" placeholder="8"></div></div>';
  if (s.onGreen === false)
    b += '<div class="row"><div class="fld" style="width:150px"><label>Yards from pin</label>'
      + '<input type="number" inputmode="numeric" data-sact="sgrem" value="'+(s.remYds??'')+'" placeholder="12"></div></div>';
  b += '<div class="row" style="margin-top:16px">'
    + '<button class="btn full" data-sact="sgsave"'+(s.dist==null||s.onGreen==null?' disabled':'')+'>Save shot</button></div>';
  openSheet((tmp._i==null ? 'Short-game shot ' : 'Edit short-game shot ') + tmp._n, b);
}

/* ---------- shot sheet: layup, recovery, or the shot at the green ---------- */
function appSheet(idx, preset){
  const h = H();
  tmp = idx==null
    ? newApp({dist: preset==null ? null : preset, lie: (h.par===3 && !h.app.length) ? 'Tee' : null})
    : JSON.parse(JSON.stringify(h.app[idx]));
  tmp._i = idx;
  tmp._n = (idx==null ? h.app.length : idx) + 1;
  tmp._chained = idx==null && preset!=null;
  drawAppSheet();
}
function drawAppSheet(){
  const s = tmp, h = H();
  const p3first = h.par===3 && (s._i===0 || (s._i==null && !h.app.length));
  const atGreen = AT_GREEN(s.state);
  let b = (s._chained ? '<div class="note" style="margin:0 0 10px">Distance carried over from the shot before — change it if you paced it differently.</div>' : '')
    + (p3first ? '<div class="note" style="margin:0 0 10px">Par 3 — this is the tee shot and the shot at the green. It is logged once, here.</div>' : '')
    + '<div class="row"><span class="lbl">What was this shot</span>'+segRow('aState',APP_STATES,s.state,'sact')+'</div>';
  if (s.state){
    b += '<hr class="sep">'
      + '<div class="row"><div class="fld" style="width:118px"><label>Yards to pin</label>'
      + '<input type="number" inputmode="numeric" data-sact="adist" value="'+(s.dist??'')+'" placeholder="'+(atGreen?'150':'240')+'"></div>'
      + '<div class="fld grow"><label>Club</label>'+selectEl('aClub',CLUBS,s.club,'—','sact')+'</div></div>'
      + '<div class="row"><span class="lbl">Lie</span>'
      + segRow('aLie', p3first ? ['Tee'] : EXTRA_LIES, s.lie, 'sact')+'</div>'
      + '<div class="row"><span class="lbl">Strike</span>'+segRow('aStrike',APP_STRIKE,s.strike,'sact')+'</div>'
      + '<hr class="sep">';
    if (atGreen){
      if (s.state==='miss')
        b += '<div class="row"><span class="lbl">Where did it end up?</span></div><div class="missgrid">'
          + ZONES.map(z=>'<button data-sact="aZone" data-v="'+z.k+'" class="'
            + (z.k==='GIR'?'centre ':'') + (s.zone===z.k?'on':'')+'">'+z.label+'</button>').join('')
          + '</div>';
      b += '<div class="row" style="margin-top:12px"><div class="fld" style="width:150px">'
        + '<label>'+(s.state==='gir'?'Feet from pin':'Yards from pin')+'</label>'
        + '<input type="number" inputmode="numeric" data-sact="aprox" value="'+(s.prox??'')+'" placeholder="'+(s.state==='gir'?'22':'12')+'"></div></div>';
    } else {
      b += '<div class="row"><span class="lbl">How it came out</span>'+segRow('aOut',EXTRA_OUT,s.result,'sact')+'</div>'
        + '<div class="row"><div class="fld" style="width:150px"><label>Yards left to pin</label>'
        + '<input type="number" inputmode="numeric" data-sact="arem" value="'+(s.remYds??'')+'" placeholder="150"></div></div>';
    }
  }
  const ready = s.state != null && (atGreen || s.result != null);
  b += '<div class="row" style="margin-top:16px">'
    + '<button class="btn full" data-sact="asave"'+(ready?'':' disabled')+'>Save shot</button></div>';
  openSheet((tmp._i==null ? 'Shot ' : 'Edit shot ') + tmp._n, b);
}

/* ---------- round summary ---------- */
function finishRound(){
  const r = R(); if(!r) return;
  r.finished = true; save();
  const t = roundTotal(r) || {strokes:0,par:0,n:0};
  const s = summarise([r]);
  const full = t.n === 18;
  const ch   = courseHandicap(r.index, r.slope, r.rating, totalPar(r));
  const diff = full ? scoreDifferential(t.strokes, r.rating, r.slope) : null;
  const b = '<div class="tiles">'
    + tile('Score', t.strokes, (t.strokes-t.par===0?'E':plus(t.strokes-t.par)) + ' · ' + t.n + ' holes')
    + tile('Putts', totalPutts(r), s.threePutts + ' three-putt' + (s.threePutts===1?'':'s'))
    + tile('Drives in play', fmtPct(s.inPlayPct), s.teeLogged + ' tee shots')
    + tile('Greens', fmtPct(s.girPct), s.girN + ' of ' + s.girHoles)
    + (ch!=null ? tile('Net', t.strokes - ch,
        'course handicap ' + plus(ch) + (full ? ' · target ' + (totalPar(r) + ch) : '')) : '')
    + (diff!=null ? tile('Differential', r1(diff),
        diff <= (r.index ?? Infinity) ? 'better than your index — this one helps' : 'above your index',
        diff <= (r.index ?? Infinity) ? 'pos' : 'neg') : '')
    + '</div>'
    + roundReconLine(r)
    + (r.incomplete ? '<div class="note">This round was logged before every shot had a slot, so its chain has gaps. It still counts for everything it can answer; anything that needs the full sequence leaves it out rather than guessing.</div>' : '')
    + (ch!=null && !full ? '<div class="note">Score differential needs all 18 holes, so it appears once the round is complete.</div>' : '')
    + '<div class="row"><div class="fld grow"><label>Round notes</label>'
    + '<textarea data-sact="rnote" placeholder="What was the story of the round?">'+esc(r.notes||'')+'</textarea></div></div>'
    + (s.leaks.length ? '<hr class="sep"><h4 style="margin-bottom:8px">Biggest leaks this round</h4>'
        + s.leaks.slice(0,3).map((l,i)=>leakRow(l,i)).join('') : '')
    + '<div class="row" style="margin-top:16px"><button class="btn ghost grow" data-sact="close">Keep editing</button>'
    + '<button class="btn grow" data-sact="closeout">Done</button></div>';
  openSheet('Round summary — ' + (r.course||''), b);
}
function tile(k,v,d,cls){
  return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div>'
    + (d?'<div class="d '+(cls||'')+'">'+d+'</div>':'')+'</div>';
}
/* ================================================================
   STATS ENGINE
   ================================================================ */
const COST = { penalty:1.1, trouble:0.6, blocked:0.35, fatThin:0.45, shortMiss:0.25, failedUD:0.45, mental:0.5 };

function summarise(rounds){
  const S = {
    rounds: rounds.length, holes:0, scored:0, strokes:0, parTotal:0,
    teeLogged:0, teeGood:0, teeBlocked:0, teeTrouble:0, teePenalty:0,
    teeDir:{L:0,F:0,R:0}, teeOff:{}, teeStrike:{}, teeDist:{short:0,ok:0,long:0}, teeDistOff:{},
    teeDirN:0, teeDistN:0, teeStrikeN:0,
    appN:0, appGreen:0, girN:0, girHoles:0, zones:{}, appStrike:{}, appProx:[], appDistBand:{},
    extraN:0, xKind:{}, xOut:{}, xLie:{}, xStrike:{}, xRem:[], xResultN:0, xBackInPlay:0, xPenalty:0,
    shortN:0, nearN:0, sgLie:{}, sgStrike:{}, sgProx:[], sgOnGreen:0, sgResultN:0,
    sgType:{}, wedgeProx:[], offGreenPutts:0, penalties:0,
    incomplete: rounds.filter(r=>r.incomplete).length,
    udAtt:0, udMade:0, scrAtt:0, scrMade:0,
    putts:0, threePutts:0, onePutts:0, sgPutt:0, sgPuttHoles:0,
    bucket:{}, breakMake:{}, puttMiss:{}, lagFrom:[], lagLeft:[],
    mental:{}, mentalPhase:{tee:0, app:0, putt:0, general:0}, perRound:[], leaks:[]
  };
  OFFLINE.forEach(k=>{ S.teeOff[k]=0; S.teeDistOff[k]=0; });
  TEE_STRIKE.forEach(k=>S.teeStrike[k]=0);
  APP_STRIKE.forEach(k=>S.appStrike[k]=0);
  ZONES.forEach(z=>S.zones[z.k]=0);
  PUTT_BUCKETS.forEach(b=>S.bucket[b.k]={n:0,made:0,base:b.base});
  BREAKS.forEach(b=>S.breakMake[b.k]={n:0,made:0});
  PUTT_MISS.forEach(k=>S.puttMiss[k]=0);
  MENTAL.forEach(k=>S.mental[k]=0);
  SG_LIES.forEach(k=>S.sgLie[k]={n:0,prox:[]});
  EXTRA_KIND.forEach(k=>S.xKind[k.k]=0);
  EXTRA_OUT.forEach(o=>S.xOut[o.k]=0);

  rounds.forEach(r=>{
    const rs = { id:r.id, date:r.date, course:r.course, strokes:0, par:0, n:0, sgPutt:0, putts:0, gir:0, girN:0, inPlay:0, teeN:0 };
    r.holes.forEach(h=>{
      const played = holeTouched(h);
      if (!played) return;
      S.holes++;
      if (h.score!=null){ S.scored++; S.strokes+=h.score; S.parTotal+=h.par; rs.strokes+=h.score; rs.par+=h.par; rs.n++; }

      /* tee */
      if (h.par!==3 && h.tee && (h.tee.outcome || h.tee.dir)){
        if (h.tee.outcome){
          S.teeLogged++; rs.teeN++;
          if (h.tee.outcome==='good'){ S.teeGood++; rs.inPlay++; }
          if (h.tee.outcome==='blocked'){ S.teeBlocked++; rs.inPlay++; }
          if (h.tee.outcome==='trouble') S.teeTrouble++;
          if (h.tee.outcome==='penalty') S.teePenalty++;
        }
        if (h.tee.dir){ S.teeDirN++; S.teeDir[h.tee.dir]=(S.teeDir[h.tee.dir]||0)+1; }
        if (h.tee.offline) S.teeOff[h.tee.offline]=(S.teeOff[h.tee.offline]||0)+1;
        if (h.tee.dist){ S.teeDistN++; S.teeDist[h.tee.dist]=(S.teeDist[h.tee.dist]||0)+1; }
        if (h.tee.distOff) S.teeDistOff[h.tee.distOff]=(S.teeDistOff[h.tee.distOff]||0)+1;
        if ((h.tee.strike||[]).length) S.teeStrikeN++;
        (h.tee.strike||[]).forEach(k=>S.teeStrike[k]=(S.teeStrike[k]||0)+1);
      }

      /* approach — the shot that was actually aimed at the green */
      const atGreen = h.app.filter(a => AT_GREEN(a.state));
      const goShot  = atGreen[atGreen.length-1] || null;
      if (goShot){
        S.appN++;
        if (goShot.state==='gir') S.appGreen++;
        const band = appBand(goShot.dist);
        if (band){ S.appDistBand[band] = S.appDistBand[band] || {n:0,gir:0}; S.appDistBand[band].n++; }
        if (goShot.state==='gir'){
          if (band) S.appDistBand[band].gir++;
          if (goShot.prox!=null) S.appProx.push(goShot.prox);
        } else if (goShot.zone){ S.zones[goShot.zone]=(S.zones[goShot.zone]||0)+1; }
        (goShot.strike||[]).forEach(k=>S.appStrike[k]=(S.appStrike[k]||0)+1);
      }

      /* Greens in regulation is derived from the chain, not read off a flag — except on
         rounds logged before the chain existed, where the shots to derive it from are
         missing and the old flag is the only honest answer. */
      const gir = girOf(h, r.incomplete);
      if (gir !== null){ S.girHoles++; rs.girN++; }
      if (gir === true){ S.girN++; rs.gir++; }

      /* scrambling — a green missed, and whether par was still made */
      if (gir === false && h.score!=null){
        S.scrAtt++; if (h.score<=h.par) S.scrMade++;
      }

      /* layups and recoveries — their own bucket, never folded into approach or GIR */
      h.app.filter(a => !AT_GREEN(a.state)).forEach(x=>{
        S.extraN++;
        const kind = x.kind || x.state;
        if (kind) S.xKind[kind] = (S.xKind[kind]||0)+1;
        if (x.result){
          S.xResultN++;
          S.xOut[x.result] = (S.xOut[x.result]||0)+1;
          if (x.result==='good' || x.result==='blocked') S.xBackInPlay++;
          if (x.result==='penalty') S.xPenalty++;
        }
        if (x.lie){ S.xLie[x.lie] = S.xLie[x.lie] || {n:0}; S.xLie[x.lie].n++; }
        (x.strike||[]).forEach(k=>S.xStrike[k]=(S.xStrike[k]||0)+1);
        if (x.remYds!=null) S.xRem.push(x.remYds);
      });

      S.penalties += (h.penalties||0);

      /* short game */
      h.short.forEach(sg=>{
        S.shortN++;
        const ty = sg.type || sgTypeFor(sg);
        if (ty){ S.sgType[ty] = S.sgType[ty] || {n:0, on:0, prox:[]}; S.sgType[ty].n++;
                 if (sg.onGreen) S.sgType[ty].on++;
                 if (sg.prox!=null) S.sgType[ty].prox.push(sg.prox); }
        /* a full wedge is a swing, not a scramble — it gets its own proximity number
           instead of inflating the up-and-down denominator */
        const near = GREENSIDE.indexOf(ty) > -1 || ty == null;
        if (near){
          S.nearN++;
          if (sg.onGreen != null){ S.sgResultN++; if (sg.onGreen) S.sgOnGreen++; }
          if (sg.prox!=null) S.sgProx.push(sg.prox);
        } else if (sg.prox!=null) S.wedgeProx.push(sg.prox);
        if (sg.lie){ S.sgLie[sg.lie]=S.sgLie[sg.lie]||{n:0,prox:[]}; S.sgLie[sg.lie].n++; if(sg.prox!=null) S.sgLie[sg.lie].prox.push(sg.prox); }
        (sg.strike||[]).forEach(k=>S.sgStrike[k]=(S.sgStrike[k]||0)+1);
        /* A putt from the fringe is the same skill as a putt on it. It stays a
           short-game shot for up-and-down and also joins the putting numbers. */
        if (sg.fromOffGreen && sg.dist!=null){
          S.offGreenPutts++;
          const ft = sg.dist * 3;                         /* yards to pin, in feet */
          const bk = puttBucket(ft);
          const holed = sg.onGreen === true && sg.prox === 0;
          S.bucket[bk.k].n++; if (holed) S.bucket[bk.k].made++;
          if (ft>=20){ S.lagFrom.push(ft); S.lagLeft.push(holed ? 0 : (sg.prox ?? null)); }
          if (!holed) (sg.miss||[]).forEach(k=>S.puttMiss[k]=(S.puttMiss[k]||0)+1);
        }
      });
      /* up and down: green missed, a greenside shot played, home in two from there */
      const nearShots = h.short.filter(sg => GREENSIDE.indexOf(sg.type || sgTypeFor(sg)) > -1 || (sg.type||sgTypeFor(sg))==null);
      if (gir === false && nearShots.length){
        S.udAtt++; if (nearShots.length + h.putts.length <= 2) S.udMade++;
      }

      /* putting */
      if (h.putts.length){
        S.putts += h.putts.length; rs.putts += h.putts.length;
        if (h.putts.length>=3) S.threePutts++;
        if (h.putts.length===1) S.onePutts++;
        const first = h.putts[0];
        if (first && first.dist!=null){
          const sg = expPutts(first.dist) - h.putts.length;
          S.sgPutt += sg; rs.sgPutt += sg; S.sgPuttHoles++;
          if (first.dist>=20){ S.lagFrom.push(first.dist); S.lagLeft.push(first.holed?0:(h.putts[1]?h.putts[1].dist:(first.rem??null))); }
        }
        h.putts.forEach(p=>{
          if (p.dist==null) return;
          const b = puttBucket(p.dist);
          S.bucket[b.k].n++; if (p.holed) S.bucket[b.k].made++;
          if (p.dist<=10 && p.brk){ S.breakMake[p.brk].n++; if(p.holed) S.breakMake[p.brk].made++; }
          if (!p.holed) (p.miss||[]).forEach(k=>S.puttMiss[k]=(S.puttMiss[k]||0)+1);
        });
      }

      MENTAL_KEYS.forEach(ph => {
        const tags = (h.mental && h.mental[ph]) || [];
        S.mentalPhase[ph] = (S.mentalPhase[ph]||0) + tags.length;
        tags.forEach(k=>S.mental[k]=(S.mental[k]||0)+1);
      });
    });
    if (rs.n) S.perRound.push(rs);
  });

  S.perRound.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  S.inPlayPct = pct(S.teeGood + S.teeBlocked, S.teeLogged);
  S.clearPct  = pct(S.teeGood, S.teeLogged);
  S.fairwayPct = pct(S.teeDir.F, S.teeDirN);
  S.shortPct   = pct(S.teeDist.short, S.teeDistN);
  S.longPct    = pct(S.teeDist.long,  S.teeDistN);
  S.middlePct  = pct(S.teeStrike['Middle']||0, S.teeStrikeN);
  S.girPct    = pct(S.girN, S.girHoles);
  S.scrPct    = pct(S.scrMade, S.scrAtt);
  S.udPct     = pct(S.udMade, S.udAtt);
  S.sgOnGreenPct = pct(S.sgOnGreen, S.sgResultN);
  S.xBackInPlayPct = pct(S.xBackInPlay, S.xResultN);
  S.xCleanPct      = pct(S.xOut.good||0, S.xResultN);
  S.xPerRound      = S.rounds ? S.extraN / S.rounds : null;
  S.avgScore  = S.scored ? S.strokes / S.rounds : null;
  S.toPar     = S.scored ? (S.strokes - S.parTotal) : null;
  S.puttsPerRound = S.rounds ? S.putts / S.rounds : null;
  S.sgPuttPerRound = S.rounds ? S.sgPutt / S.rounds : null;
  S.avgProx   = avg(S.appProx);
  S.avgLagLeft= avg(S.lagLeft.filter(x=>x!=null));
  S.leaks     = buildLeaks(S);
  return S;
}

function buildLeaks(S){
  const n = Math.max(S.rounds,1), L = [];
  const push = (cost,title,stat,fix) => { if (cost>0.05) L.push({cost,title,stat,fix}); };

  push(S.teePenalty*COST.penalty/n, 'Penalty shots off the tee',
    S.teePenalty+' penalty tee shot'+(S.teePenalty===1?'':'s')+' over '+S.rounds+' round'+(S.rounds===1?'':'s')
      +' — '+fmtPct(pct(S.teePenalty,S.teeLogged))+' of drives.',
    'Nothing else on this list is worth touching until the ball stays in bounds. Widen the target, take less club where trouble is one-sided.');

  push(S.teeTrouble*COST.trouble/n, 'Drives leaving no shot at the green',
    S.teeTrouble+' recovery-only tee shot'+(S.teeTrouble===1?'':'s')+'; clear shot to the green on only '+fmtPct(S.clearPct)+' of drives.',
    'Track the miss pattern below. If it is one-sided, aim off it rather than trying to fix it mid-round.');

  push(S.teeBlocked*COST.blocked/n, 'In play but blocked',
    S.teeBlocked+' drive'+(S.teeBlocked===1?'':'s')+' in play with no clear shot.',
    'This is usually a strategy leak, not a swing leak — check which side of the fairway you are starting from.');

  const worstStrike = Object.entries(S.teeStrike).sort((a,b)=>b[1]-a[1])[0];
  if (worstStrike && worstStrike[1]>=3)
    push(worstStrike[1]*0.3/n, worstStrike[0].toLowerCase()+' strikes with the driver',
      worstStrike[1]+' logged '+worstStrike[0].toLowerCase()+' strike'+(worstStrike[1]===1?'':'s')+'.',
      'Face-tape or foot-spray the driver and run Adam Young’s strike drills — this is the Strike Plan material.');

  const fatThin = (S.appStrike['Fat']||0) + (S.appStrike['Thin']||0);
  push(fatThin*COST.fatThin/n, 'Ground contact on approach shots',
    fatThin+' fat or thin approach'+(fatThin===1?'':'es')+' logged.',
    'Ground contact costs more distance than face strike. Low-point control drills before anything technical.');

  const shortMiss = (S.zones['S']||0)+(S.zones['SL']||0)+(S.zones['SR']||0);
  const longMiss  = (S.zones['L']||0)+(S.zones['LL']||0)+(S.zones['LR']||0);
  if (shortMiss >= longMiss*2 && shortMiss>=4)
    push(shortMiss*COST.shortMiss/n, 'Approaches finishing short',
      shortMiss+' short misses against '+longMiss+' long — you are systematically under-clubbing.',
      'Chart your real carry numbers, not your best ones, and play to the middle of the green.');

  if (S.sgPuttPerRound!=null && S.sgPuttPerRound < -0.5)
    push(-S.sgPuttPerRound, 'Putting',
      'Losing '+r1(-S.sgPuttPerRound)+' strokes a round on the greens against the tour baseline. '
      + S.threePutts+' three-putt'+(S.threePutts===1?'':'s')+'.',
      'Check the make-rate chart to see whether the leak is short putts or lag speed — they need different practice.');

  if (S.udAtt>=4 && S.udPct!=null && S.udPct<45)
    push((S.udAtt-S.udMade)*COST.failedUD/n, 'Getting up and down',
      'Converted '+S.udMade+' of '+S.udAtt+' ('+fmtPct(S.udPct)+') when you missed the green.',
      'Proximity is the whole game here — log where the chips finish and practise to a landing spot, not a technique.');

  if (S.teeDistN >= 8 && S.teeDist.short >= S.teeDist.long*2 && S.teeDist.short >= 4)
    push(S.teeDist.short*0.2/n, 'Coming up short off the tee',
      S.teeDist.short+' of '+S.teeDistN+' drives finished short of where you expected against '+S.teeDist.long+' long.',
      'Either the strike is costing you distance or the expectation is wrong. Check the strike chart first — if it is clean, your yardage is optimistic.');

  const phaseName = {tee:'off the tee', app:'on approach', putt:'on the greens', general:''};
  Object.entries(S.mental).filter(([,v])=>v>=3).forEach(([k,v])=>{
    const worst = Object.entries(S.mentalPhase).filter(([p])=>p!=='general')
      .sort((a,b)=>b[1]-a[1])[0];
    const where = worst && worst[1] ? ' Most of your mental faults land ' + phaseName[worst[0]] + '.' : '';
    push(v*COST.mental/n, k, v+' occurrence'+(v===1?'':'s')+' across '+S.rounds+' round'+(S.rounds===1?'':'s')+'.' + where,
      'Mental faults are the cheapest strokes on this list to buy back — they need a decision routine, not a range session.');
  });

  return L.sort((a,b)=>b.cost-a.cost);
}

function leakRow(l,i){
  return '<div class="leak p'+(i+1)+'"><div class="rank">'+(i+1)+'</div><div>'
    + '<div class="t">'+esc(l.title)+' <span style="color:var(--muted);font-weight:600">· ~'+r1(l.cost)+' shots/round</span></div>'
    + '<div class="s">'+esc(l.stat)+'</div><div class="fix">'+esc(l.fix)+'</div></div></div>';
}

/* ================================================================
   CHARTS (hand-rolled SVG — no dependencies, works offline)
   ================================================================ */
const CHW = 6.3;                       /* ~char width at the 11px chart font */
const trunc = (t, px) => { const n = Math.floor(px/CHW); return t.length>n ? t.slice(0,Math.max(1,n-1))+'\u2026' : t; };

function hbar(rows, opts){
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r=>r.v));
  const txt = rows.map(r => String(r.t!=null ? r.t : r.v));
  const LW = opts.labelW || 108;
  const RW = Math.max(28, Math.max.apply(null, txt.map(t=>t.length))*CHW + 12);
  const BH = 26, GAP = 7, W = 480, TW = W-LW-RW;
  const H = rows.length*(BH+GAP) + 4;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'')+'">';
  rows.forEach((r,i)=>{
    const y = i*(BH+GAP)+2, w = Math.max(r.v>0?3:0, TW * r.v/max);
    const fill = r.fill || 'var(--s1)';
    s += '<text class="lab" x="0" y="'+(y+BH/2+4)+'">'+esc(trunc(String(r.k), LW-8))+'<title>'+esc(r.k)+'</title></text>';
    s += '<rect class="mk" x="'+LW+'" y="'+y+'" width="'+w+'" height="'+BH+'" rx="4" fill="'+fill+'"><title>'+esc(r.k)+': '+esc(txt[i])+'</title></rect>';
    s += '<text class="val" x="'+(LW+w+8)+'" y="'+(y+BH/2+4)+'">'+esc(txt[i])+'</text>';
  });
  return s + '</svg>';
}

function groupedBar(cats, series, opts){
  opts = opts||{};
  const W=480, H=200, PL=34, PB=34, PT=8, PR=6;
  const iw = W-PL-PR, ih = H-PB-PT;
  const max = opts.max!=null ? opts.max : Math.max(1, ...series.flatMap(s=>s.v));
  const gw = iw/cats.length, bw = Math.min(20, (gw-8)/series.length);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'')+'">';
  for (let g=0; g<=4; g++){
    const y = PT + ih - ih*g/4;
    s += '<line class="gl" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s += '<text x="'+(PL-7)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*g/4)+(opts.suffix||'')+'</text>';
  }
  cats.forEach((c,i)=>{
    const cx = PL + gw*i + gw/2;
    series.forEach((se,j)=>{
      const v = se.v[i]; if (v==null) return;
      const h = ih * Math.max(0,v)/max;
      const x = cx - (series.length*bw + (series.length-1)*3)/2 + j*(bw+3);
      s += '<rect class="mk" x="'+x+'" y="'+(PT+ih-h)+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="4" fill="'+se.fill+'">'
         + '<title>'+esc(se.name)+' · '+esc(c)+': '+v+(opts.suffix||'')+'</title></rect>';
    });
    s += '<text x="'+cx+'" y="'+(H-PB+16)+'" text-anchor="middle">'+esc(c)+'</text>';
  });
  s += '<line class="ax" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/>';
  return s+'</svg>';
}

function divBar(rows, opts){
  opts = opts||{};
  const W=480, BH=24, GAP=8, PL=108, PR=8;
  const H = rows.length*(BH+GAP)+8;
  const max = Math.max(0.5, ...rows.map(r=>Math.abs(r.v)));
  /* The value is drawn INSIDE the bar whenever the bar is long enough to hold it —
     which is what stops the longest negative bar from pushing its label back over the
     row name. Only bars too short to hold the text fall back to an outside label, and
     a short bar's outside label reaches at most 2*VW+20 past the axis, so a gutter is
     reserved only when the plot is narrower than that. It never is at this width, so
     the bars get the full half-width back. */
  const VW   = Math.max.apply(null, rows.map(r => plus(r2(r.v)).length)) * CHW;
  const span = (W - PL - PR)/2;
  const G    = Math.max(0, (2*VW + 20) - span)/2;
  const half = Math.max(20, span - G);
  const mid  = PL + G + half;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'')+'">';
  s += '<line class="ax" x1="'+mid+'" y1="0" x2="'+mid+'" y2="'+(H-4)+'"/>';
  rows.forEach((r,i)=>{
    const y=i*(BH+GAP)+2, w = half*Math.abs(r.v)/max;
    const x = r.v>=0 ? mid : mid-w;
    const fill = r.v>=0 ? 'var(--s1)' : 'var(--s8)';
    const lbl = plus(r2(r.v)), tw = lbl.length*CHW, inside = w > tw + 12;
    /* inside: hard against the far end of the bar. outside: just past it, as before. */
    const vx = inside ? (r.v>=0 ? x+w-6 : x+6) : (r.v>=0 ? x+w+8 : x-8);
    const va = inside ? (r.v>=0 ? 'end' : 'start') : (r.v>=0 ? 'start' : 'end');
    s += '<text class="lab" x="0" y="'+(y+BH/2+4)+'">'+esc(trunc(String(r.k), PL-10))+'<title>'+esc(r.k)+'</title></text>';
    s += '<rect class="mk" x="'+x+'" y="'+y+'" width="'+Math.max(w,2)+'" height="'+BH+'" rx="4" fill="'+fill+'"><title>'+esc(r.k)+': '+lbl+'</title></rect>';
    s += '<text class="val'+(inside?' on':'')+'" x="'+vx+'" y="'+(y+BH/2+4)+'" text-anchor="'+va+'">'+lbl+'</text>';
  });
  return s+'</svg>';
}

function lineChart(pts, opts){
  opts = opts||{};
  if (pts.length<2) return '<div class="note">Two or more rounds needed for a trend.</div>';
  const W=480,H=180,PL=32,PB=28,PT=10,PR=10;
  const iw=W-PL-PR, ih=H-PB-PT;
  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi===lo){ hi+=1; lo-=1; }
  const pad = (hi-lo)*0.15; lo-=pad; hi+=pad;
  const X = i => PL + iw*(pts.length===1?0.5:i/(pts.length-1));
  const Y = v => PT + ih - ih*(v-lo)/(hi-lo);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'')+'">';
  for(let g=0;g<=3;g++){
    const y=PT+ih-ih*g/3, v=lo+(hi-lo)*g/3;
    s+='<line class="gl" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }
  s+='<path d="'+pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.v)).join(' ')+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i)=>{
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>'+esc(p.k)+': '+esc(p.t||p.v)+'</title></circle>';
  });
  const last=pts[pts.length-1];
  s+='<text class="val" x="'+(X(pts.length-1))+'" y="'+(Y(last.v)-11)+'" text-anchor="end">'+esc(last.t||last.v)+'</text>';
  pts.forEach((p,i)=>{ if(pts.length<=8 || i===0 || i===pts.length-1)
    s+='<text x="'+X(i)+'" y="'+(H-PB+16)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'">'+esc(p.k)+'</text>'; });
  return s+'</svg>';
}

function heatGrid(zones){
  const vals = ZONES.filter(z=>z.k!=='GIR').map(z=>zones[z.k]||0);
  const max = Math.max(1,...vals);
  const steps = ['var(--seq1)','var(--seq2)','var(--seq3)','var(--seq4)','var(--seq5)','var(--seq6)'];
  let s = '<div class="missgrid" style="max-width:300px">';
  ZONES.forEach(z=>{
    if (z.k==='GIR'){ s += '<button class="centre" disabled>⛳</button>'; return; }
    const v = zones[z.k]||0;
    const idx = v===0 ? -1 : Math.min(5, Math.floor(v/max*5.999));
    const bg = idx<0 ? 'var(--surface)' : steps[idx];
    const ink = idx>=3 ? '#fff' : 'var(--ink-2)';
    s += '<button disabled style="background:'+bg+';color:'+ink+';border-color:var(--border);font-size:11px">'
      + '<span><b style="font-size:17px;display:block;font-variant-numeric:tabular-nums">'+v+'</b>'+z.label+'</span></button>';
  });
  return s+'</div>';
}

function tableView(head, rows){
  return '<details class="tblwrap"><summary>Show the numbers</summary><table class="tbl"><thead><tr>'
    + head.map(h=>'<th>'+esc(h)+'</th>').join('') + '</tr></thead><tbody>'
    + rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')
    + '</tbody></table></details>';
}
function box(title, cap, chart, table){
  return '<div class="chartbox"><h4>'+title+'</h4><div class="cap">'+cap+'</div>'+chart+(table||'')+'</div>';
}
function legend(items){
  return '<div class="legend">'+items.map(i=>'<span><i style="background:'+i.c+'"></i>'+esc(i.n)+'</span>').join('')+'</div>';
}

/* ---------- stats view ---------- */
let statFilter = 'all';
function renderStats(){
  const all = DB.rounds.filter(r=>roundTotal(r));
  if (!all.length){
    $('#statsWrap').innerHTML = '<div class="empty"><div class="big">◧</div><h3>No data yet</h3>'
      + '<p>Play a round and log it — the charts and the practice priority list build themselves from what you enter.</p></div>';
    return;
  }
  const sorted = all.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const sel = statFilter==='all' ? sorted : statFilter==='5' ? sorted.slice(0,5) : statFilter==='10' ? sorted.slice(0,10) : sorted.filter(r=>r.id===statFilter);
  const S = summarise(sel);

  let h = '<div class="row" style="margin-bottom:12px">'
    + chipRow('filter',[{k:'all',label:'All ('+all.length+')'},{k:'10',label:'Last 10'},{k:'5',label:'Last 5'}], ['all','10','5'].indexOf(statFilter)>-1?statFilter:null)
    + '</div>';
  /* Say it once, at the top, rather than footnoting every number it touches. */
  if (S.incomplete)
    h += '<div class="recon bad" style="margin:0 0 12px">\u26a0 ' + S.incomplete + ' of ' + S.rounds
       + ' round' + (S.rounds===1?'':'s') + ' here has gaps in the shot chain. Greens in regulation on '
       + 'those rounds is read from what was flagged at the time, not derived, and anything needing the '
       + 'full sequence leaves them out.</div>';

  /* headline tiles */
  const relPer = S.rounds ? (S.strokes - S.parTotal)/S.rounds : null;
  h += '<div class="tiles">'
    + tile('Scoring average', S.avgScore==null?'—':r1(S.avgScore), relPer==null?'':plus(r1(relPer))+' to par · '+S.rounds+' round'+(S.rounds===1?'':'s'))
    + tile('Drives in play', fmtPct(S.inPlayPct), 'Clear shot to green '+fmtPct(S.clearPct))
    + tile('Fairways hit', fmtPct(S.fairwayPct), S.teeDir.F+' of '+S.teeDirN+' drives')
    + tile('Greens in reg', fmtPct(S.girPct), S.girN+' of '+S.girHoles+(S.avgProx?' · '+r1(S.avgProx)+' ft avg':''))
    + tile('Putts per round', S.puttsPerRound==null?'—':r1(S.puttsPerRound), S.threePutts+' three-putt'+(S.threePutts===1?'':'s')+' · '+S.onePutts+' one-putt'+(S.onePutts===1?'':'s'))
    + tile('SG putting', S.sgPuttPerRound==null?'—':plus(r2(S.sgPuttPerRound)), 'per round vs tour baseline', S.sgPuttPerRound>=0?'pos':'neg')
    + tile('Scrambling', fmtPct(S.scrPct), S.scrMade+' of '+S.scrAtt+' missed greens saved')
    + '</div>';

  /* practice priority */
  h += '<div class="card"><div class="hd"><h3>Where your shots are going</h3></div><div class="bd">';
  if (S.leaks.length){
    h += S.leaks.slice(0,5).map((l,i)=>leakRow(l,i)).join('');
    h += '<div class="note">Cost estimates are rough: a penalty tee shot is charged '+COST.penalty+' shots, a recovery '+COST.trouble+
      ', a fat or thin approach '+COST.fatThin+', a mental fault '+COST.mental+'. Putting uses real strokes-gained. '
      + 'The ranking is what matters, not the decimals.</div>';
  } else {
    h += '<div class="note">Nothing is standing out yet — log a few more rounds and the ranking gets meaningful.</div>';
  }
  h += '</div></div>';

  /* ---- driving ---- */
  const teeRows = [
    {k:'Good', v:S.teeGood, fill:'var(--seq6)'},
    {k:'Blocked', v:S.teeBlocked, fill:'var(--seq5)'},
    {k:'Recovery', v:S.teeTrouble, fill:'var(--seq4)'},
    {k:'Penalty', v:S.teePenalty, fill:'var(--seq3)'}
  ].map(r=>Object.assign(r,{t:r.v+' ('+fmtPct(pct(r.v,S.teeLogged))+')'}));

  h += '<div class="card"><div class="hd"><h3>Off the tee</h3></div><div class="bd">';
  if (S.teeLogged){
    h += box('Where every drive finished',
      'Ordered best to worst. “In play” is the first two bars — '+fmtPct(S.inPlayPct)+' of '+S.teeLogged+' tee shots on par 4s and 5s.',
      hbar(teeRows,{labelW:80,aria:'Tee shot outcomes'}),
      tableView(['Result','Drives','Share'], teeRows.map(r=>[esc(r.k), r.v, fmtPct(pct(r.v,S.teeLogged))])));

    const dirRows = [
      {k:'Left',    v:S.teeDir.L||0, t:(S.teeDir.L||0)+' ('+fmtPct(pct(S.teeDir.L||0,S.teeDirN))+')'},
      {k:'Fairway', v:S.teeDir.F||0, t:(S.teeDir.F||0)+' ('+fmtPct(pct(S.teeDir.F||0,S.teeDirN))+')'},
      {k:'Right',   v:S.teeDir.R||0, t:(S.teeDir.R||0)+' ('+fmtPct(pct(S.teeDir.R||0,S.teeDirN))+')'}
    ];
    const offRows = OFFLINE.map(k=>({k, v:S.teeOff[k]||0}));
    const distRows = [
      {k:'Short',       v:S.teeDist.short||0},
      {k:'As expected', v:S.teeDist.ok||0},
      {k:'Long',        v:S.teeDist.long||0}
    ];
    const distOffRows = OFFLINE.map(k=>({k, v:S.teeDistOff[k]||0}));
    const strRows = TEE_STRIKE.map(k=>({k, v:S.teeStrike[k]||0}));

    if (S.teeDirN) h += box('Where every drive finishes laterally',
      'All '+S.teeDirN+' logged drives, not just the bad ones. A one-sided pattern is worth aiming off before it is worth fixing.',
      hbar(dirRows,{labelW:70,aria:'Drive direction'}));
    if (offRows.some(r=>r.v)) h += box('How far offline','Only counted on drives that missed the fairway. Past 25 yards is where clear shots to the green start disappearing.',hbar(offRows,{labelW:80,aria:'Distance offline'}));
    if (S.teeDistN) h += box('Distance control off the tee','Whether the ball finished where you expected it to.',hbar(distRows,{labelW:96,aria:'Tee distance'}));
    if (distOffRows.some(r=>r.v)) h += box('How far short or past','On the drives that missed your expected number.',hbar(distOffRows,{labelW:80,aria:'Tee distance miss'}));
    if (strRows.some(r=>r.v)) h += box('Strike location',
      'Face contact on every logged drive'+(S.middlePct!=null ? ' — middle on '+fmtPct(S.middlePct)+'' : '')+'. A one-sided pattern here is a Strike Plan job.',
      hbar(strRows,{labelW:60,aria:'Driver strike'}));
  } else h += '<div class="note">No tee shots logged yet.</div>';
  h += '</div></div>';

  /* ---- approach ---- */
  h += '<div class="card"><div class="hd"><h3>Approach play</h3></div><div class="bd">';
  if (S.appN){
    h += box('Where you miss greens',
      'Darker means more misses. '+S.appGreen+' of '+S.appN+' shots at the green found it. Greens in regulation \u2014 on the surface in par minus two, penalties counted \u2014 is '+fmtPct(S.girPct)+'.',
      heatGrid(S.zones),
      tableView(['Zone','Misses'], ZONES.filter(z=>z.k!=='GIR').map(z=>[z.label.replace('<br>',' '), S.zones[z.k]||0])));

    const appStr = APP_STRIKE.map(k=>({k,v:S.appStrike[k]||0}));
    if (appStr.some(r=>r.v)) h += box('Contact on the misses','Fat and thin are ground contact; toe and heel are face contact. They are different problems with different fixes.',hbar(appStr,{labelW:60,aria:'Approach strike'}));

    /* Bands with no approaches are omitted rather than drawn at 0%: a zero-length bar
       reads as "you never hit this green", when in fact you were never in that range. */
    const bands = APP_BANDS.map(b => ({b, d: S.appDistBand[b.k]})).filter(x => x.d && x.d.n);
    const thin  = bands.filter(x => x.d.n < APP_MIN_N).length;
    if (bands.length) h += box('Greens hit by distance',
      'Where your effective range ends.' + (thin ? ' Greyed bands have fewer than '+APP_MIN_N+' approaches — too few to read anything into.' : ''),
      hbar(bands.map(({b,d})=>({
        k: b.k,
        v: pct(d.gir,d.n)||0,
        t: fmtPct(pct(d.gir,d.n))+' ('+d.gir+'/'+d.n+(d.n<APP_MIN_N?', small n':'')+')',
        fill: d.n<APP_MIN_N ? 'var(--muted)' : 'var(--s1)'
      })),{labelW:80,aria:'GIR by distance'}));
  } else h += '<div class="note">No approaches logged yet.</div>';
  h += '</div></div>';

  /* ---- putting ---- */
  h += '<div class="card"><div class="hd"><h3>Putting</h3></div><div class="bd">';
  if (S.putts){
    const bk = PUTT_BUCKETS.filter(b=>S.bucket[b.k].n>0);
    if (bk.length){
      h += '<div class="chartbox"><h4>Make rate by distance</h4>'
        + '<div class="cap">Your make rate against an approximate PGA Tour baseline. Bars are only meaningful where the attempt count is reasonable — check the table.</div>'
        + legend([{c:'var(--s1)',n:'You'},{c:'var(--s2)',n:'Tour baseline'}])
        + groupedBar(bk.map(b=>b.k.replace(' ft','')), [
            {name:'You', fill:'var(--s1)', v:bk.map(b=>pct(S.bucket[b.k].made,S.bucket[b.k].n)||0)},
            {name:'Tour baseline', fill:'var(--s2)', v:bk.map(b=>Math.round(b.base*100))}
          ], {max:100, suffix:'%', aria:'Make rate by distance'})
        + tableView(['Distance','Attempts','Made','You','Tour'],
            bk.map(b=>[b.k, S.bucket[b.k].n, S.bucket[b.k].made, fmtPct(pct(S.bucket[b.k].made,S.bucket[b.k].n)), Math.round(b.base*100)+'%']))
        + '</div>';
    }
    const brRows = BREAKS.filter(b=>S.breakMake[b.k].n).map(b=>({
      k:b.label, v:pct(S.breakMake[b.k].made,S.breakMake[b.k].n)||0,
      t:fmtPct(pct(S.breakMake[b.k].made,S.breakMake[b.k].n))+' ('+S.breakMake[b.k].made+'/'+S.breakMake[b.k].n+')'}));
    if (brRows.length) h += box('Make rate inside 10 feet, by break',
      'A gap between left-to-right and right-to-left is an aim or read bias, and it is fixable in one practice session.',
      hbar(brRows,{labelW:100,aria:'Make rate by break'}));

    const missRows = PUTT_MISS.map(k=>({k,v:S.puttMiss[k]||0})).filter(r=>r.v);
    if (missRows.length) h += box('Why putts missed','Speed misses (short, long) and line misses (high, low, push, pull) need different practice.',hbar(missRows,{labelW:80,aria:'Putt miss reasons'}));

    if (S.lagLeft.filter(x=>x!=null).length)
      h += '<div class="note"><b>Lag putting.</b> From 20 feet and beyond you average '+r1(S.avgLagLeft)+' feet left, over '
        + S.lagLeft.filter(x=>x!=null).length+' putts. Tour average is roughly 3 feet from 25 and about 5 feet from 40.</div>';

    if (S.perRound.length>1)
      h += box('Strokes gained putting, round by round','Above the line is strokes won on the greens; below is strokes lost.',
        divBar(S.perRound.map(r=>({k:(r.date||'').slice(5)+' '+(r.course||'').slice(0,10), v:r.sgPutt})),{aria:'SG putting per round'}));
  } else h += '<div class="note">No putts logged yet.</div>';
  h += '</div></div>';

  /* ---- short game ---- */
  const sgRows = Object.entries(S.sgLie).filter(([,v])=>v.n).map(([k,v])=>({k, v: v.prox.length?Math.round(avg(v.prox)):0, t:(v.prox.length?r1(avg(v.prox))+' ft':'—')+' ('+v.n+')'}));
  /* declared order, so the row order is the shot ladder and never the order they arrived */
  const sgTypeRows = SG_TYPES.map(ty => {
    const d = S.sgType[ty.k];
    if (!d || !d.n) return null;
    return {k: ty.label, v: d.n,
      t: d.n + ' shot' + (d.n===1?'':'s') + (d.prox.length ? ' \u00b7 ' + r1(avg(d.prox)) + ' ft avg' : '')};
  }).filter(Boolean);
  if (S.shortN){
    h += '<div class="card"><div class="hd"><h3>Short game</h3></div><div class="bd">'
      + '<div class="tiles">'
      + tile('Up &amp; down', fmtPct(S.udPct), S.udMade+' of '+S.udAtt+' greenside attempts')
      + tile('Avg proximity', S.sgProx.length?r1(avg(S.sgProx))+'<small> ft</small>':'—', S.nearN+' greenside shots')
      + (S.sgResultN ? tile('Found the green', fmtPct(S.sgOnGreenPct), S.sgOnGreen+' of '+S.sgResultN+' greenside shots') : '')
      + (S.wedgeProx.length ? tile('Full wedge proximity', r1(avg(S.wedgeProx))+'<small> ft</small>', S.wedgeProx.length+' shots over 40 yds') : '')
      + '</div>'
      + (S.wedgeProx.length || S.offGreenPutts
          ? '<div class="note" style="margin:0 0 12px">Up and down counts greenside shots only — chips, pitches, bunker shots and putts from the fringe. '
            + 'A full wedge from 60 or 100 yards is a swing, not a scramble, so it has its own proximity number'
            + (S.offGreenPutts ? '. ' + S.offGreenPutts + ' putt' + (S.offGreenPutts===1?'':'s') + ' played from off the surface also count in the putting numbers.' : '.')
            + '</div>' : '')
      + (sgTypeRows.length ? box('By shot type','Chips, pitches, bunker shots and full wedges are different skills; the average that mixes them tells you nothing.',hbar(sgTypeRows,{labelW:96,aria:'Short game by type'})) : '')
      + (sgRows.length ? box('Average proximity by lie','Shorter is better. This is the number that decides your up-and-down rate.',hbar(sgRows,{labelW:96,aria:'Short game proximity by lie'})) : '')
      + '</div></div>';
  }

  /* ---- layup / advance / recovery ---- */
  if (S.extraN){
    const xKindRows = EXTRA_KIND.map(k=>({k:k.label, v:S.xKind[k.k]||0})).filter(r=>r.v);
    const xOutRows  = EXTRA_OUT.map(o=>({k:o.label, v:S.xOut[o.k]||0})).filter(r=>r.v);
    const xLieRows  = Object.entries(S.xLie).filter(([,v])=>v.n).map(([k,v])=>({k, v:v.n}));
    h += '<div class="card"><div class="hd"><h3>Layup, advance &amp; recovery</h3></div><div class="bd">'
      + '<div class="tiles">'
      + tile('Back in play', fmtPct(S.xBackInPlayPct), S.xBackInPlay+' of '+S.xResultN+' shots')
      + tile('Left a clear shot', fmtPct(S.xCleanPct), 'came out as planned')
      + tile('Per round', S.xPerRound==null?'—':r1(S.xPerRound), S.extraN+' logged'
          + (S.xPenalty ? ' · '+S.xPenalty+' penalty' : ''))
      + '</div>'
      + (xKindRows.length ? box('What they were','A layup is a plan; a recovery is a rescue. The mix shows how often the tee shot forced your hand.',hbar(xKindRows,{labelW:96,aria:'Shot types'})) : '')
      + (xOutRows.length ? box('How they came out','Kept out of your approach and GIR numbers on purpose — a punch-out sideways is not an approach.',hbar(xOutRows,{labelW:96,aria:'Shot results'})) : '')
      + (xLieRows.length ? box('Where they were played from','',hbar(xLieRows,{labelW:96,aria:'Lies'})) : '')
      + '</div></div>';
  }

  /* ---- mental ---- */
  const mRows = MENTAL.map(k=>({k,v:S.mental[k]||0})).filter(r=>r.v);
  if (mRows.length){
    const phaseRows = [
      {k:'Off the tee', v:S.mentalPhase.tee||0},
      {k:'Approach',    v:S.mentalPhase.app||0},
      {k:'Putting',     v:S.mentalPhase.putt||0}
    ].concat(S.mentalPhase.general ? [{k:'Untagged phase', v:S.mentalPhase.general}] : []);
    h += '<div class="card"><div class="hd"><h3>Mental &amp; strategy</h3></div><div class="bd">'
      + box('Fault tally','Adam Young’s categories — good strike, good line, poor outcome.',hbar(mRows,{labelW:130,aria:'Mental faults'}))
      + (phaseRows.some(r=>r.v) ? box('Where they happen','If one phase dominates, that is where the decision routine needs work.',hbar(phaseRows,{labelW:110,aria:'Mental faults by phase'})) : '')
      + '</div></div>';
  }

  /* ---- trend ---- */
  if (S.perRound.length>1){
    h += '<div class="card"><div class="hd"><h3>Trend</h3></div><div class="bd">'
      + box('Score to par by round','',lineChart(S.perRound.map(r=>({k:(r.date||'').slice(5), v:r.strokes-r.par, t:plus(r.strokes-r.par)})),{aria:'Score to par trend'}))
      + '</div></div>';
  }
  $('#statsWrap').innerHTML = h;
}

function dl(name, text, type){
  const b = new Blob([text], {type: type||'text/csv;charset=utf-8'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 400);
  toast('Exported ' + name);
}
const q = v => v==null ? '' : /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);

function csvShots(){
  const head = ['round_date','course','tees','hole','par','score','penalties','shot_no','shot_type','club','outcome','direction','offline',
    'tee_distance','tee_distance_miss','strike','lie','yards_in','miss_zone','proximity',
    'putt_distance_ft','break','slope','holed','left_ft','miss_reason','mental','note','round_incomplete'];
  const rows = [head.join(',')];
  const DIR = {L:'left', F:'fairway', R:'right'};
  DB.rounds.forEach(r=>r.holes.forEach(h=>{
    if (!holeTouched(h)) return;
    const base = [r.date, r.course, r.tees, h.n, h.par, h.score, h.penalties||0];
    const m = h.mental || {};
    const inc = r.incomplete ? 'yes' : 'no';
    /* one row per shot, in the order played, so the file reconciles the same way the app does */
    let no = 0;
    const push = cols => rows.push(base.concat([++no]).concat(cols).concat([inc]).map(q).join(','));
    if (h.tee && (h.tee.outcome || h.tee.dir)) push(['tee', h.tee.club, h.tee.outcome,
      DIR[h.tee.dir] || h.tee.dir, h.tee.offline, h.tee.dist, h.tee.distOff,
      (h.tee.strike||[]).join('|'), '', '', '', '', '', '', '', '', '', '',
      (m.tee||[]).join('|'), h.note]);
    h.app.forEach(a => push([AT_GREEN(a.state) ? 'approach' : (a.kind || a.state),
      a.club, AT_GREEN(a.state) ? a.state : a.result, '', '', '', '',
      (a.strike||[]).join('|'), a.lie, a.dist, a.zone,
      AT_GREEN(a.state) ? a.prox : a.remYds, '', '', '', '', '', '',
      (m.app||[]).join('|'), h.note]));
    h.short.forEach(sg => push(['short_' + ((sg.type || sgTypeFor(sg) || 'shot').replace(' ','_')), sg.club,
      sg.onGreen===true?'on green':sg.onGreen===false?'missed green':'', '', '', '', '',
      (sg.strike||[]).join('|'), sg.lie, sg.dist, '', sg.onGreen===false ? sg.remYds : sg.prox,
      '', '', '', '', '', (sg.miss||[]).join('|'), '', '']));
    h.putts.forEach((p,i) => push(['putt_'+(i+1), 'Putter', p.holed?'holed':'missed', '', '', '', '', '',
      'Green', '', '', '', p.dist, p.brk, p.slope, p.holed?'yes':'no', p.rem, (p.miss||[]).join('|'),
      i===0 ? (m.putt||[]).join('|') : '', '']));
  }));
  dl('shots.csv', rows.join('\n'));
}
function csvRounds(){
  const head = ['date','course','tees','course_rating','slope','handicap_index','course_handicap','net','score_differential',
    'conditions','wind','temp','feel','holes','strokes','par','to_par','putts',
    'three_putts','drives_logged','in_play_pct','clear_shot_pct','fairway_pct','short_pct','long_pct',
    'gir_pct','scrambling_pct','sg_putting','notes'];
  const rows = [head.join(',')];
  DB.rounds.forEach(r=>{
    const t = roundTotal(r); if(!t) return;
    const S = summarise([r]);
    const ch = courseHandicap(r.index, r.slope, r.rating, totalPar(r));
    const diff = t.n === 18 ? scoreDifferential(t.strokes, r.rating, r.slope) : null;
    rows.push([r.date,r.course,r.tees,r.rating,r.slope,r.index,ch,ch!=null?t.strokes-ch:null,diff!=null?r1(diff):null,
      r.conditions,r.wind,r.temp,r.feel,t.n,t.strokes,t.par,t.strokes-t.par,
      totalPutts(r),S.threePutts,S.teeLogged,S.inPlayPct,S.clearPct,S.fairwayPct,S.shortPct,S.longPct,
      S.girPct,S.scrPct,r2(S.sgPutt),r.notes].map(q).join(','));
  });
  dl('rounds.csv', rows.join('\n'));
}
function csvPutts(){
  const head = ['date','course','hole','par','putt_number','distance_ft','break','slope','holed','left_ft','miss_reason','putts_on_hole','sg_putting_hole'];
  const rows = [head.join(',')];
  DB.rounds.forEach(r=>r.holes.forEach(h=>{
    if (!h.putts.length) return;
    const sg = h.putts[0] && h.putts[0].dist!=null ? r2(expPutts(h.putts[0].dist)-h.putts.length) : '';
    h.putts.forEach((p,i)=>rows.push([r.date,r.course,h.n,h.par,i+1,p.dist,p.brk,p.slope,p.holed?'yes':'no',
      p.rem,(p.miss||[]).join('|'),h.putts.length, i===0?sg:''].map(q).join(',')));
  }));
  dl('putting.csv', rows.join('\n'));
}

/* ================================================================
